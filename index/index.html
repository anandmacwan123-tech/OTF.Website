<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OTF — Index</title>
<meta name="description" content="An index of graduating students from BA (Hons) Graphic Design, Ravensbourne University London.">
<link rel="canonical" href="https://otfshow.anandmacwan123.workers.dev/index/">
<meta name="theme-color" content="#ffffff">
<meta property="og:title" content="OTF — Index">
<meta property="og:description" content="An index of graduating students from BA (Hons) Graphic Design, Ravensbourne University London.">
<meta property="og:image" content="https://otfshow.anandmacwan123.workers.dev/Favicon.jpg">
<meta property="og:image:type" content="image/jpeg">
<meta property="og:image:alt" content="OTF — Ravensbourne Graphic Design Show">
<meta property="og:url" content="https://otfshow.anandmacwan123.workers.dev/index/">
<meta property="og:type" content="website">
<meta property="og:site_name" content="OTF">
<meta property="og:locale" content="en_GB">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="OTF — Index">
<meta name="twitter:description" content="An index of graduating students from BA (Hons) Graphic Design, Ravensbourne University London.">
<meta name="twitter:image" content="https://otfshow.anandmacwan123.workers.dev/Favicon.jpg">
<link rel="icon" type="image/jpeg" href="/Favicon.jpg">
<link rel="apple-touch-icon" href="/Favicon.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #fff;
    --fg: #000;
    --muted: #6a6a6a;
    --col-text: 720px;
  }

  html, body {
    background: var(--bg);
    font-family: 'IBM Plex Sans', system-ui, sans-serif;
    color: var(--fg);
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  body {
    min-height: 100vh;
    min-height: 100dvh;
    padding: 6vh 5vw 6rem;
  }

  .state {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 500;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    font-size: 0.85rem;
    color: var(--muted);
  }

  .content[hidden] { display: none; }

  .view[hidden] { display: none; }

  /* ─── LIST VIEW ─── */

  .search-input {
    display: block;
    width: 100%;
    padding: 0.75rem 0;
    background: none;
    border: none;
    border-bottom: 1px solid rgba(0, 0, 0, 0.08);
    font-family: inherit;
    font-size: clamp(1rem, 0.4vw + 0.85rem, 1.0625rem);
    letter-spacing: -0.01em;
    color: var(--fg);
    outline: none;
    -webkit-appearance: none;
    appearance: none;
  }
  .search-input::placeholder { color: var(--muted); }
  .search-input::-webkit-search-cancel-button,
  .search-input::-webkit-search-decoration { display: none; }

  .student-list {
    list-style: none;
    display: flex;
    flex-direction: column;
  }

  .student-list li {
    border-bottom: 1px solid rgba(0, 0, 0, 0.08);
  }

  .student-list li:first-child {
    border-top: 1px solid rgba(0, 0, 0, 0.08);
  }

  .student-list a,
  .student-list .row {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 1.5rem;
    padding: 0.75rem 0;
    color: var(--fg);
    text-decoration: none;
    font-size: clamp(1rem, 0.4vw + 0.85rem, 1.0625rem);
    line-height: 1.4;
    letter-spacing: -0.01em;
    transition: opacity 0.2s ease;
  }

  .student-list a:hover { opacity: 0.55; }

  .student-list .name { font-weight: 400; }
  .student-list .disciplines {
    color: var(--muted);
    text-align: right;
    font-weight: 500;
    font-size: clamp(0.475rem, 0.55vw + 0.275rem, 0.6rem);
    letter-spacing: 0.04em;
    text-transform: uppercase;
    line-height: 1.25;
    flex-shrink: 0;
  }

  /* ─── FACES VIEW ─── */
  .faces-view {
    max-width: 1400px;
    margin: 0 auto;
  }

  .headshot-grid {
    list-style: none;
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: clamp(0.5rem, 1vw, 1rem);
  }

  /* Label above each headshot */
  .label {
    display: inline-flex;
    align-self: flex-start;
    padding: 0 2px;
    align-items: center;
    justify-content: center;
    gap: 10px;
    font-family: 'IBM Plex Sans', system-ui, sans-serif;
    font-size: 16px;
    font-weight: 700;
    line-height: normal;
    letter-spacing: -0.12em;
    text-transform: uppercase;
  }
  .label-headshot { background: #FC1233; color: #000; }

  .headshot-grid li {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
  }

  .headshot-grid a {
    display: block;
    width: 100%;
    aspect-ratio: 3 / 4;
    overflow: hidden;
    transition: opacity 0.2s ease;
  }

  .headshot-grid a:hover { opacity: 0.75; }

  .headshot-grid img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  @media (max-width: 900px) {
    .headshot-grid { grid-template-columns: repeat(4, 1fr); }
  }

  @media (max-width: 560px) {
    .headshot-grid { grid-template-columns: repeat(3, 1fr); }
    .student-list a,
    .student-list .row { gap: 1rem; }
  }

  /* ─── NAV ─── */
  .nav {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    z-index: 10;
    padding: 1rem 4vw;
    background: var(--bg);
  }

  .nav-left { justify-self: start; }
  .nav-center {
    justify-self: center;
    display: flex;
    align-items: center;
    gap: clamp(0.75rem, 2vw, 1.25rem);
  }

  .nav a,
  .nav button,
  .nav .view-label {
    background: none;
    border: 0;
    padding: 0;
    color: #000;
    font-family: inherit;
    text-decoration: none;
    font-weight: 500;
    font-size: clamp(0.475rem, 0.55vw + 0.275rem, 0.6rem);
    line-height: 1.25;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    cursor: pointer;
    transition: opacity 0.2s ease;
  }

  .nav a:hover,
  .nav button:hover { opacity: 0.55; }

  .nav .view-label {
    opacity: 0.5;
    cursor: default;
  }

  .nav button[aria-pressed="false"] { opacity: 0.5; }
  .nav button[aria-pressed="false"]:hover { opacity: 0.8; }

  .sr-only {
    position: absolute;
    width: 1px;
    height: 1px;
    padding: 0;
    margin: -1px;
    overflow: hidden;
    clip: rect(0, 0, 0, 0);
    white-space: nowrap;
    border: 0;
  }
</style>
</head>
<body>
  <h1 class="sr-only">OTF — Student Index</h1>

  <p class="state" id="state">Loading…</p>

  <main class="content" id="content" hidden>
    <section class="view list-view" id="listView">
      <div class="list-wrap" style="max-width: var(--col-text); margin: 0 auto;">
        <input type="search" id="search" class="search-input" placeholder="Search" autocomplete="off" spellcheck="false" aria-label="Search students">
        <ul class="student-list" id="studentList"></ul>
      </div>
    </section>

    <section class="view faces-view" id="facesView" hidden>
      <ul class="headshot-grid" id="headshotGrid"></ul>
    </section>
  </main>

  <nav class="nav" aria-label="Primary">
    <div class="nav-left">
      <a href="/showcase/">[BACK]</a>
    </div>
    <div class="nav-center">
      <span class="view-label" aria-hidden="true">VIEW</span>
      <button type="button" id="listBtn" aria-pressed="true">[LIST]</button>
      <button type="button" id="facesBtn" aria-pressed="false">[FACES]</button>
    </div>
  </nav>

<script>
(() => {
  // __MANIFEST_START__
    const MANIFEST = {
      "Anand": ["Anand_based_1.webp", "Anand_Based_1.webp", "Anand_Evolving_1.webp", "Anand_NCI_1.webp", "Anand_RaveBadge_1.webp", "Anand_ThinkingBlock_1.webp"],
      "Arnete": ["Arnete_Aqva_1.webp", "Arnete_Atsijungti_1.webp", "Arnete_InthePresenceofGreen_1.webp", "Arnete_Postcard Series_1.webp"],
      "Becky": ["Becky_Kopparberg1_1.webp", "Becky_Kopparberg2_1.webp", "Becky_Kopparberg2-1_1.webp"],
      "Carolina": ["Carolina_Aqua_1.webp", "Carolina_Packaging_1.webp", "Carolina_Zine_1.webp"],
      "Charles": ["Charles_Agneshouse_1.webp", "Charles_KpopZine_1.webp", "Charles_TMS_1.webp"],
      "Darcy": ["Darcy_Untitled_1.webp"],
      "Divine": ["Divine_ABOTABOT_1.webp", "Divine_TerraCotta_1.webp", "Divine_UntitledZine_1.webp"],
      "Elise": ["Elise_Tera1_1.webp", "Elise_Tera2_1.webp", "Elise_Tera3_1.webp"],
      "Emily": ["Emily_4THGENZine_1.webp", "Emily_Globular_1.webp", "Emily_Sign_1.webp"],
      "Jaeden": ["Jaeden_FameSucks_1.webp", "Jaeden_FameSucks1_1.webp", "Jaeden_FameSucks2_1.webp"],
      "Jamie": ["Jamie_HemDuyen_1.webp", "Jamie_Kynexus_1.webp"],
      "Jenna": ["Jenna_Aer_1.webp", "Jenna_Privacy Matters_1.webp", "Jenna_Veil_1.webp"],
      "Jess": ["Jess_Aqya_1.webp", "Jess_CFTSOC_1.webp", "Jess_Untitled_1.webp"],
      "Kami": ["Kami_FOOF1_1.webp", "Kami_FOOF2_1.webp", "Kami_FOOF3_1.webp"],
      "Kye": ["Kye_HeadphonesAd_1.webp", "Kye_IncensePackaging_1.webp", "Kye_Untitled_1.webp"],
      "Martim": ["Martim_5PP_1.webp", "Martim_B33ChairPoster_1.webp", "Martim_Reflections_1.webp"],
      "Maseray": ["Maseray_IgnisStudios_1.webp", "Maseray_LordandSaviour_1.webp", "Maseray_ThedesignersArchive_1.webp"],
      "Nikol": ["Nikol_Aquari_1.webp", "Nikol_CREATEPoster_1.webp", "Nikol_WWTPLUposter_1.webp"],
      "Noora": ["Noora_Lipstick_1.webp", "Noora_PFI_1.webp", "Noora_RP_1.webp"],
      "Nora": ["Nora_Overstack_1.webp", "Nora_PhobiaFiles_1.webp", "Nora_ShakenNotStirred_1.webp", "Nora_ShakenNotStirred2_1.webp", "Nora_SmultringerPhotography_1.webp", "Nora_SmultringerPhotography2_1.webp"],
      "Nuria": [],
      "Oli": [],
      "Olya": [],
      "Oscar": [],
      "Rebecca": [],
      "Sara": [],
      "Sasha": [],
      "Sebastian": [],
      "Shalom": [],
      "Surayya": [],
      "Taleb": [],
      "Tallulah": [],
      "Valentina": [],
      "Vanessa": [],
      "Will": []
    };
    // __MANIFEST_END__

  const SHEET_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTxvTorU4JVoWJPpqxRsiM5SllpkB9mI8oEtaIfX4KYS804dlL6HMo6r97-BHYqhA/pub?output=csv';

  const stateEl = document.getElementById('state');
  const contentEl = document.getElementById('content');
  const listEl = document.getElementById('studentList');
  const gridEl = document.getElementById('headshotGrid');
  const listView = document.getElementById('listView');
  const facesView = document.getElementById('facesView');
  const listBtn = document.getElementById('listBtn');
  const facesBtn = document.getElementById('facesBtn');
  const searchEl = document.getElementById('search');

  let allEntries = [];

  const enc = p => p.split('/').map(encodeURIComponent).join('/');
  const HAS_HEADSHOT = new Set(Object.keys(MANIFEST));

  // CSV parser identical in behaviour to the one in /students/index.html
  function parseCSV(text) {
    const sample = text.split(/\r?\n/).slice(0, 5).join('\n');
    const tabs = (sample.match(/\t/g) || []).length;
    const commas = (sample.match(/,/g) || []).length;
    const delim = tabs > commas ? '\t' : ',';
    const rows = [];
    let row = [], field = '', inQuotes = false;
    for (let i = 0; i < text.length; i++) {
      const c = text[i];
      if (inQuotes) {
        if (c === '"') {
          if (text[i + 1] === '"') { field += '"'; i++; }
          else { inQuotes = false; }
        } else { field += c; }
      } else if (c === '"') {
        inQuotes = true;
      } else if (c === delim) {
        row.push(field); field = '';
      } else if (c === '\n' || c === '\r') {
        if (c === '\r' && text[i + 1] === '\n') i++;
        row.push(field); rows.push(row);
        row = []; field = '';
      } else { field += c; }
    }
    if (field.length || row.length) { row.push(field); rows.push(row); }
    return rows;
  }

  const COLUMNS = [
    '#', 'Headshot', 'Name', 'Name translated', 'Language', 'Confidence',
    'Notes', 'Bio', 'Bio translated', 'Project images (link)',
    'Project description 1', 'Project description 1 translated',
    'Project description 2', 'Project description 2 translated',
    'Project description 3', 'Project description 3 translated',
    'Project description 4', 'Project description 4 translated',
    'Project description 5', 'Project description 5 translated',
  ];

  function toObjects(rows) {
    if (!rows.length) return [];
    const hasRealHeader = rows[0].some(c => c && c.trim().toLowerCase() === 'name');
    let headers, dataStart;
    if (hasRealHeader) {
      headers = rows[0].map(h => h.trim());
      dataStart = 1;
    } else {
      headers = COLUMNS;
      const placeholder = rows[0].every(c => !c.trim() || c.trim() === '#');
      dataStart = placeholder ? 1 : 0;
    }
    return rows.slice(dataStart)
      .filter(r => r.some(c => c && c.trim()))
      .map(r => {
        const o = {};
        headers.forEach((h, i) => { o[h] = (r[i] ?? '').trim(); });
        return o;
      });
  }

  function field(row, ...names) {
    if (!row) return '';
    const keys = Object.keys(row);
    for (const n of names) {
      const k = keys.find(k => k.toLowerCase() === n.toLowerCase());
      if (k && row[k]) return row[k];
    }
    return '';
  }

  function disciplinesFor(row) {
    return ['Practice1', 'Practice2', 'Practice3']
      .map(n => field(row, n))
      .filter(Boolean)
      .join(', ');
  }

  // Match a manifest key (first name) to a sheet row whose Name starts with it.
  function rowForFirstName(objs, firstName) {
    const target = firstName.toLowerCase();
    return objs.find(o => {
      const n = field(o, 'Name').toLowerCase().trim();
      if (!n) return false;
      if (n === target) return true;
      return n.split(/\s+/)[0] === target;
    }) || null;
  }

  function renderList(entries) {
    listEl.innerHTML = '';
    for (const e of entries) {
      const li = document.createElement('li');
      const inner = document.createElement(e.href ? 'a' : 'div');
      if (e.href) inner.href = e.href;
      else inner.className = 'row';

      const name = document.createElement('span');
      name.className = 'name';
      name.textContent = e.displayName;

      const disc = document.createElement('span');
      disc.className = 'disciplines';
      disc.textContent = e.disciplines || '';

      inner.append(name, disc);
      li.appendChild(inner);
      listEl.appendChild(li);
    }
  }

  function renderFaces(entries) {
    gridEl.innerHTML = '';
    for (const e of entries) {
      if (!e.headshot) continue;
      const li = document.createElement('li');
      const lbl = document.createElement('div');
      lbl.className = 'label label-headshot';
      lbl.textContent = e.displayName;
      li.appendChild(lbl);
      const a = document.createElement('a');
      a.href = e.href;
      a.setAttribute('aria-label', `Open ${e.displayName}'s portfolio`);
      const img = document.createElement('img');
      img.src = enc(`/Student Work/Headshots/${e.firstName}.webp`);
      img.alt = `${e.displayName} — portrait`;
      img.loading = 'lazy';
      a.appendChild(img);
      li.appendChild(a);
      gridEl.appendChild(li);
    }
  }

  // Build entries: union of MANIFEST keys (have headshots) and sheet rows
  // (may include names we don't yet have assets for). Each entry has:
  //   firstName, displayName, disciplines, headshot (bool), href (or null)
  function buildEntries(objs) {
    const byFirstName = new Map();

    // Seed from sheet first so we keep the sheet's "First Last" display name.
    for (const row of objs) {
      const full = field(row, 'Name').trim();
      if (!full) continue;
      const first = full.split(/\s+/)[0];
      const key = first.toLowerCase();
      if (byFirstName.has(key)) continue;
      const hasHeadshot = HAS_HEADSHOT.has(first);
      byFirstName.set(key, {
        firstName: first,
        displayName: full,
        disciplines: disciplinesFor(row),
        headshot: hasHeadshot,
        href: hasHeadshot ? `/students/${first.toLowerCase()}/` : null,
      });
    }

    // Backfill: any manifest student missing from the sheet still appears.
    for (const first of HAS_HEADSHOT) {
      const key = first.toLowerCase();
      if (byFirstName.has(key)) continue;
      byFirstName.set(key, {
        firstName: first,
        displayName: first,
        disciplines: '',
        headshot: true,
        href: `/students/${first.toLowerCase()}/`,
      });
    }

    return [...byFirstName.values()]
      .sort((a, b) => a.displayName.localeCompare(b.displayName));
  }

  function setView(which) {
    const isList = which === 'list';
    listView.hidden = !isList;
    facesView.hidden = isList;
    listBtn.setAttribute('aria-pressed', String(isList));
    facesBtn.setAttribute('aria-pressed', String(!isList));
    try {
      const url = new URL(location.href);
      url.searchParams.set('view', isList ? 'list' : 'faces');
      history.replaceState(null, '', url);
    } catch {}
  }

  listBtn.addEventListener('click', () => setView('list'));
  facesBtn.addEventListener('click', () => setView('faces'));

  searchEl.addEventListener('input', () => {
    const q = searchEl.value.trim().toLowerCase();
    const filtered = q
      ? allEntries.filter(e =>
          e.displayName.toLowerCase().includes(q) ||
          e.disciplines.toLowerCase().includes(q))
      : allEntries;
    renderList(filtered);
  });

  function reveal(entries) {
    allEntries = entries;
    renderList(entries);
    renderFaces(entries);
    contentEl.hidden = false;
    stateEl.remove();
    const initial = new URLSearchParams(location.search).get('view') === 'faces' ? 'faces' : 'list';
    setView(initial);
  }

  const sheetUrl = SHEET_URL + (SHEET_URL.includes('?') ? '&' : '?') + 't=' + Date.now();

  fetch(sheetUrl, { cache: 'no-store' })
    .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.text(); })
    .then(text => {
      const objs = toObjects(parseCSV(text));
      reveal(buildEntries(objs));
    })
    .catch(err => {
      console.error('[OTF] Sheet fetch failed:', err);
      reveal(buildEntries([]));
    });
})();
</script>
</body>
</html>
