<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #000;
    --fg: #fff;
    --muted: #9a9a9a;
    --col-text: 540px;
    --col-image: 960px;
    --pad-x: 10vw;
  }

  html { scroll-behavior: smooth; }
  html, body, * { scrollbar-width: none; -ms-overflow-style: none; }
  *::-webkit-scrollbar { display: none; width: 0; height: 0; }

  html, body {
    background: var(--bg);
    font-family: 'IBM Plex Sans', system-ui, sans-serif;
    color: var(--fg);
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    -webkit-text-size-adjust: 100%;
    -moz-text-size-adjust: 100%;
    text-size-adjust: 100%;
  }

  body {
    min-height: 100vh;
    min-height: 100dvh;
    padding: 6vh var(--pad-x) 8rem;
  }

  /* Keyboard focus ring — visible for tab users, suppressed for mouse/touch. */
  a:focus-visible {
    outline: 2px solid var(--fg);
    outline-offset: 3px;
  }

  /* Honour OS "reduce motion" — drop hover/scroll transitions. */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      transition-duration: 0.01ms !important;
      scroll-behavior: auto !important;
    }
  }

  .portfolio[hidden] { display: none; }

  .state {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 500;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    font-size: 0.85rem;
    color: var(--muted);
  }

  /* Two-row grid: row 1 = name label (col 1 only);
     row 2 = headshot | bio | practices | links, all top-aligned. */
  .hero {
    margin: 0 0 7rem;
    display: grid;
    grid-template-columns: auto minmax(0, 380px) auto auto;
    grid-template-rows: auto auto;
    /* Min reduced so the doubled side padding pulls the columns
       together rather than squeezing the bio. */
    column-gap: clamp(0.75rem, 2vw, 4rem);
    row-gap: 0;
    align-items: start;
  }

  /* Label occupies row 1 of the headshot column only. */
  .hero > .label-headshot { grid-column: 1; grid-row: 1; align-self: end; justify-self: start; }
  /* Headshot sits in row 2, aligned to the top of that row. */
  .hero-headshot { grid-column: 1; grid-row: 2; align-self: start; }
  /* Bio, practices, links all in row 2 — top-aligned to the headshot. */
  .bio            { grid-column: 2; grid-row: 2; align-self: start; }
  .hero-practices { grid-column: 3; grid-row: 2; align-self: start; }
  .socials        { grid-column: 4; grid-row: 2; align-self: start; }

  /* Display labels — student name (headshot) and project titles. A colored
     container with the title text, rendered in HTML rather than baked into
     the image. Sits flush on top of the image, top-left aligned. */
  .label {
    display: inline-flex;
    align-self: flex-start;
    padding: 0 2px;
    justify-content: center;
    align-items: center;
    gap: 10px;
    font-family: 'IBM Plex Sans', system-ui, sans-serif;
    font-size: 24px;
    font-weight: 700;
    line-height: normal;
    letter-spacing: -0.12em;
    text-transform: uppercase;
  }
  .label-headshot { background: #FC1233; color: #000; }
  .label-project  { background: #fff;    color: #000; }

  .hero-headshot {
    height: clamp(280px, 50vh, 560px);
    width: auto;
    display: block;
    flex-shrink: 0;
  }

  /* Design practices — stacked, left-aligned, body-text size, bold caps. */
  .hero-practices {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 0.3rem;
    font-weight: 700;
    font-size: clamp(1rem, 0.4vw + 0.85rem, 1.0625rem);
    line-height: 1.3;
    letter-spacing: 0.02em;
    text-transform: uppercase;
    color: var(--fg);
  }

  .bio {
    max-width: var(--col-text);
    font-size: clamp(1rem, 0.4vw + 0.85rem, 1.0625rem);
    line-height: 1.55;
    letter-spacing: -0.01em;
  }

  .bio p + p { margin-top: 1rem; }

  .socials {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 0.3rem;
  }
  .socials a {
    position: relative;
    color: var(--fg);
    text-decoration: none;
    font-weight: 500;
    font-size: 1rem;
    line-height: 1.25;
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }

  .projects {
    display: flex;
    flex-direction: column;
    gap: 7rem;
    margin: 0;
  }

  .project { display: flex; flex-direction: column; }

  .project .images {
    display: flex;
    flex-direction: row;
    gap: 1rem;
    overflow-x: auto;
    overflow-y: hidden;
    /* Extend beyond body padding so scrollable strip reaches viewport edge */
    margin: 0 calc(-1 * var(--pad-x));
    padding: 0 var(--pad-x) 0.5rem;
    scrollbar-width: none;
    /* Momentum scroll + gentle snap so each image settles into view */
    -webkit-overflow-scrolling: touch;
    scroll-snap-type: x proximity;
    scroll-padding-left: var(--pad-x);
  }

  .project .images img,
  .project .images .project-video { scroll-snap-align: start; }

  .project .images img {
    height: clamp(280px, 50vh, 480px);
    width: auto;
    display: block;
    flex-shrink: 0;
  }

  /* Project video — embeds in the image strip, with custom controls. */
  .project-video {
    position: relative;
    height: clamp(280px, 50vh, 480px);
    aspect-ratio: 16 / 9;
    flex-shrink: 0;
    background: #000;
    overflow: hidden;
  }
  .project-video iframe,
  .project-video .pv-mount {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    border: 0;
    display: block;
  }
  .project-video:fullscreen { height: 100%; width: 100%; aspect-ratio: auto; }
  .pv-btn {
    position: absolute;
    bottom: 0;
    z-index: 2;
    width: 42px;
    height: 42px;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
    border: 0;
    background: none;
    color: #fff;
    cursor: pointer;
    filter: drop-shadow(0 1px 2px rgba(0, 0, 0, 0.65));
    transition: transform 0.15s ease;
  }
  .pv-btn:hover { transform: scale(1.18); }
  .pv-btn svg { width: 16px; height: 16px; display: block; fill: currentColor; }
  .pv-play { left: 0; }
  .pv-fs { right: 0; }
  .pv-bar {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    height: 3px;
    z-index: 1;
    background: rgba(252, 18, 51, 0.3);
  }
  .pv-bar-fill { height: 100%; width: 0; background: #FC1233; }

  .project-desc {
    max-width: var(--col-text);
    margin: 1.25rem 0 0;
    font-size: clamp(1rem, 0.4vw + 0.85rem, 1.0625rem);
    line-height: 1.55;
    letter-spacing: -0.01em;
  }

  @media (max-width: 720px) {
    /* Mobile keeps the original 7vw side padding — the doubled desktop
       value would crush the single-column layout. */
    :root { --pad-x: 7vw; }
    /* Single column, reordered: name, headshot, practices, bio, links. */
    .hero {
      display: flex;
      flex-direction: column;
      align-items: stretch;
      gap: 1.75rem;
      margin-bottom: 3.5rem;
    }
    .hero > .label-headshot { order: 1; align-self: flex-start; }
    .hero-headshot { order: 2; }
    .hero-practices { order: 3; }
    .bio { order: 4; max-width: none; }
    .socials { order: 5; }
    /* Override the desktop column placement: fill the single column. */
    .hero-headshot, .bio, .hero-practices, .socials { align-self: stretch; }
    /* Headshot fills the column; pull it up under the label (cancel the flex
       gap) so the label sits flush on top like desktop. */
    .hero-headshot { width: 100%; height: auto; margin-top: -1.75rem; }
    /* Practices on one horizontal line, middot-separated, at bio text size. */
    .hero-practices {
      flex-flow: row wrap;
      align-items: baseline;
      gap: 0.4rem;
      font-size: clamp(1rem, 0.4vw + 0.85rem, 1.0625rem);
    }
    .hero-practices span:not(:last-child)::after {
      content: "·";
      margin-left: 0.4rem;
    }
    /* Links horizontal. */
    .socials {
      flex-direction: row;
      flex-wrap: wrap;
      gap: clamp(1rem, 4vw, 2rem);
    }
    /* Project images scaled down to 0.6x. */
    .project .images img,
    .project-video { height: clamp(168px, 30vh, 288px); }
    .projects { gap: 4rem; }
    /* Shrink the bottom nav so the three links + arrows fit narrow screens. */
    .nav { gap: 1.25rem; padding: 0.85rem 4vw; }
    .nav a, .nav-arrow { font-size: 0.85rem; }
  }

  /* Labels are 24px on desktop; slightly smaller on mobile. */
  @media (max-width: 768px) {
    .label { font-size: 20px; }
  }

  .nav {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    display: flex;
    justify-content: center;
    gap: clamp(1.5rem, 5vw, 4rem);
    z-index: 10;
    padding: 1rem 4vw;
    background: var(--bg);
  }
  .nav a {
    color: var(--fg);
    text-decoration: none;
    font-weight: 500;
    font-size: 1rem;
    line-height: 1.25;
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }
  /* Bracketed links — the [ ] are pseudo-elements so they drop away on
     hover/focus/active, leaving the label in bold. */
  .nav a::before, .socials a::before { content: "["; }
  .nav a::after,  .socials a::after  { content: "]"; }
  .nav a::before, .nav a::after,
  .socials a::before, .socials a::after { transition: opacity 0.18s ease; }
  .nav a:hover, .nav a:focus-visible, .nav a:active,
  .socials a:hover, .socials a:focus-visible, .socials a:active { font-weight: 700; }
  .nav a:hover::before, .nav a:hover::after,
  .nav a:focus-visible::before, .nav a:focus-visible::after,
  .nav a:active::before, .nav a:active::after,
  .socials a:hover::before, .socials a:hover::after,
  .socials a:focus-visible::before, .socials a:focus-visible::after,
  .socials a:active::before, .socials a:active::after { opacity: 0; }
  .nav a[aria-current="page"] { font-weight: 700; }
  .nav a[aria-current="page"]::before,
  .nav a[aria-current="page"]::after { opacity: 0; }

  /* Prev/next student arrows — pinned to the nav bar edges. */
  .nav-arrow {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
  }
  .nav-prev { left: 4vw; }
  .nav-next { right: 4vw; }

  .sr-only {
    position: absolute;
    width: 1px;
    height: 1px;
    padding: 0;
    margin: -1px;
    overflow: hidden;
    clip: rect(0, 0, 0, 0);
    white-space: nowrap;
    border: 0;
  }
</style>
</head>

  // CSV/TSV parser — quoted fields, doubled-quote escape, CRLF/LF newlines.
  // Auto-detects delimiter by sampling the first 5 lines.
  function parseCSV(text) {
    const sample = text.split(/\r?\n/).slice(0, 5).join('\n');
    const tabs = (sample.match(/\t/g) || []).length;
    const commas = (sample.match(/,/g) || []).length;
    const delim = tabs > commas ? '\t' : ',';
    const rows = [];
    let row = [], field = '', inQuotes = false;
    for (let i = 0; i < text.length; i++) {
      const c = text[i];
      if (inQuotes) {
        if (c === '"') {
          if (text[i + 1] === '"') { field += '"'; i++; }
          else { inQuotes = false; }
        } else { field += c; }
      } else if (c === '"') {
        inQuotes = true;
      } else if (c === delim) {
        row.push(field); field = '';
      } else if (c === '\n' || c === '\r') {
        if (c === '\r' && text[i + 1] === '\n') i++;
        row.push(field); rows.push(row);
        row = []; field = '';
      } else { field += c; }
    }
    if (field.length || row.length) { row.push(field); rows.push(row); }
    return rows;
  }

  // The published sheet exports a row of "#,#,#,..." instead of real headers,

  const COLUMNS = [
    '#',                                  // 0

  ];

  // Convert raw CSV rows to objects. If the first row contains a real "Name"
  // cell, use the CSV's own headers; otherwise fall back to the hardcoded
  // COLUMNS schema and skip a placeholder row (e.g. "#,#,#,...") if present.
  function toObjects(rows) {
    if (!rows.length) return [];
    const hasRealHeader = rows[0].some(c => c && c.trim().toLowerCase() === 'name');
    let headers, dataStart;
    if (hasRealHeader) {
      headers = rows[0].map(h => h.trim());
      dataStart = 1;
    } else {
      headers = COLUMNS;
      const placeholder = rows[0].every(c => !c.trim() || c.trim() === '#');
      dataStart = placeholder ? 1 : 0;
    }
    return rows.slice(dataStart)
      .filter(r => r.some(c => c && c.trim()))
      .map(r => {
        const o = {};
        headers.forEach((h, i) => { o[h] = (r[i] ?? '').trim(); });
        return o;
      });
  }

  // Group project filenames into projects keyed by storage name.
  // New convention: <Student>_<Project>_<N>.webp — group by <Project>, order by <N>.
  // Legacy files (no `_<N>` tail) fall back to stripping trailing digits so
  // pre-rename batches like FameSucks / FameSucks1 / FameSucks2 still group.
  // Skips Unassigned, collapses Untitled<K> → "Untitled".
  function projectGroups(name, files) {
    const prefixRe = new RegExp('^' + name.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '_');
    const order = [];
    const groups = new Map();
    for (const file of files) {
      const stem = file.replace(/\.(webp|url)$/i, '').replace(prefixRe, '');
      let project, n;
      const m = stem.match(/^(.+)_(\d+)$/);
      if (m) {
        project = m[1];
        n = +m[2];
      } else {
        const numMatch = stem.match(/(\d+)(?:-\d+)?$/);
        n = numMatch ? +numMatch[1] : 0;
        project = stem.replace(/\d+(?:-\d+)?$/, '') || stem;
      }
      if (project === 'Unassigned') continue;
      const displayName = /^Untitled\d*$/.test(project) ? 'Untitled' : project;
      if (!groups.has(project)) { groups.set(project, { displayName, files: [] }); order.push(project); }
      groups.get(project).files.push({ file, n });
    }
    for (const g of groups.values()) g.files.sort((a, b) => a.n - b.n || a.file.localeCompare(b.file));
    return order.map(p => ({ key: p, base: groups.get(p).displayName, files: groups.get(p).files.map(x => x.file) }));
  }

  // Look up a description for a project group. The sheet uses positional
  // columns: "Project description 1" .. "Project description 5". The base
  // name fallbacks below let the schema evolve later without code changes.
  function lookupDesc(row, name, base, index) {
    if (!row) return '';
    const candidates = [
      `Project description ${index + 1}`,
      `Project Description ${index + 1}`,
      `Project${index + 1}_Desc`,
      base,
      `${base}_Desc`,
      `${name}_${base}`,
    ];
    const keys = Object.keys(row);
    for (const cand of candidates) {
      const key = keys.find(k => k.toLowerCase() === cand.toLowerCase());
      if (key && row[key]) return row[key];
    }
    return '';
  }

  // Case-insensitive column getter — sheet headers occasionally have stray

  function field(row, ...names) {

    for (const n of names) {
      const k = keys.find(k => k.toLowerCase() === n.toLowerCase());
      if (k && row[k]) return row[k];
    }
    return '';
  }

  // ── Video embeds (YouTube / Vimeo with custom controls) ─────────────
  function videoMeta(url) {
    let m;
    if ((m = url.match(/(?:youtube\.com\/(?:watch\?(?:.*&)?v=|embed\/|shorts\/|live\/)|youtu\.be\/)([\w-]{11})/)))
      return { provider: 'youtube', id: m[1] };
    if ((m = url.match(/vimeo\.com\/(?:video\/|channels\/[\w]+\/|groups\/[^/]+\/videos\/)?(\d+)/)))
      return { provider: 'vimeo', id: m[1] };
    return null;
  }

  let ytApiPromise, vimeoApiPromise;
  function loadYouTubeApi() {
    if (ytApiPromise) return ytApiPromise;
    ytApiPromise = new Promise(resolve => {
      const prev = window.onYouTubeIframeAPIReady;
      window.onYouTubeIframeAPIReady = () => { if (prev) prev(); resolve(window.YT); };
      const s = document.createElement('script');
      s.src = 'https://www.youtube.com/iframe_api';
      document.head.appendChild(s);
    });
    return ytApiPromise;
  }
  function loadVimeoApi() {
    if (vimeoApiPromise) return vimeoApiPromise;
    vimeoApiPromise = new Promise(resolve => {
      const s = document.createElement('script');
      s.src = 'https://player.vimeo.com/api/player.js';
      s.onload = () => resolve(window.Vimeo);
      document.head.appendChild(s);
    });
    return vimeoApiPromise;
  }

  const PV_PLAY = '<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>';
  const PV_PAUSE = '<svg viewBox="0 0 24 24"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>';
  const PV_FS = '<svg viewBox="0 0 24 24"><path d="M4 4h6v2H6v4H4zm10 0h6v6h-2V6h-4zM4 14h2v4h4v2H4zm14 0h2v6h-6v-2h4z"/></svg>';

  // Build a .project-video element with custom controls for a stored link.
  function makeVideoEmbed(filename) {
    const wrap = document.createElement('div');
    wrap.className = 'project-video';

    const playBtn = document.createElement('button');
    playBtn.type = 'button';
    playBtn.className = 'pv-btn pv-play';
    playBtn.setAttribute('aria-label', 'Play');
    playBtn.innerHTML = PV_PLAY;

    const fsBtn = document.createElement('button');
    fsBtn.type = 'button';
    fsBtn.className = 'pv-btn pv-fs';
    fsBtn.setAttribute('aria-label', 'Fullscreen');
    fsBtn.innerHTML = PV_FS;
    fsBtn.addEventListener('click', () => {
      if (document.fullscreenElement) document.exitFullscreen();
      else if (wrap.requestFullscreen) wrap.requestFullscreen();
    });

    const bar = document.createElement('div');
    bar.className = 'pv-bar';
    const fill = document.createElement('div');
    fill.className = 'pv-bar-fill';
    bar.appendChild(fill);

    wrap.append(playBtn, fsBtn, bar);

    const ui = {
      playBtn,
      setPlaying(p) {
        playBtn.innerHTML = p ? PV_PAUSE : PV_PLAY;
        playBtn.setAttribute('aria-label', p ? 'Pause' : 'Play');
      },
      setProgress(cur, dur) {
        fill.style.width = (dur > 0 ? Math.min(100, cur / dur * 100) : 0) + '%';
      },
    };

    fetch(enc('/Student Work/Projects/' + filename), { cache: 'no-store' })
      .then(r => r.ok ? r.text() : Promise.reject(new Error('missing')))
      .then(text => {
        const meta = videoMeta(text.trim());
        if (!meta) throw new Error('unrecognised link');
        if (meta.provider === 'youtube') mountYouTube(wrap, meta.id, ui);
        else mountVimeo(wrap, meta.id, ui);
      })
      .catch(() => { wrap.remove(); });

    return wrap;
  }

  function mountYouTube(wrap, id, ui) {
    const mount = document.createElement('div');
    mount.className = 'pv-mount';
    wrap.insertBefore(mount, wrap.firstChild);
    loadYouTubeApi().then(YT => {
      let tick = null;
      const player = new YT.Player(mount, {
        videoId: id,
        playerVars: { controls: 0, modestbranding: 1, rel: 0, playsinline: 1,
                      disablekb: 1, fs: 0, iv_load_policy: 3 },
        events: {
          onStateChange: e => {
            const playing = e.data === YT.PlayerState.PLAYING;
            ui.setPlaying(playing);
            clearInterval(tick);
            if (playing) {
              tick = setInterval(() => {
                ui.setProgress(player.getCurrentTime() || 0, player.getDuration() || 0);
              }, 200);
            }
          },
        },
      });
      ui.playBtn.addEventListener('click', () => {
        if (player.getPlayerState && player.getPlayerState() === YT.PlayerState.PLAYING)
          player.pauseVideo();
        else player.playVideo();
      });
    });
  }

  function mountVimeo(wrap, id, ui) {
    const iframe = document.createElement('iframe');
    iframe.src = 'https://player.vimeo.com/video/' + id +
      '?controls=0&title=0&byline=0&portrait=0&playsinline=1&dnt=1';
    iframe.allow = 'autoplay; fullscreen; picture-in-picture';
    wrap.insertBefore(iframe, wrap.firstChild);
    loadVimeoApi().then(Vimeo => {
      const player = new Vimeo.Player(iframe);
      player.on('play', () => ui.setPlaying(true));
      player.on('pause', () => ui.setPlaying(false));
      player.on('ended', () => ui.setPlaying(false));
      player.on('timeupdate', d => ui.setProgress(d.seconds, d.duration));
      ui.playBtn.addEventListener('click', () => {
        player.getPaused().then(paused => paused ? player.play() : player.pause());
      });
    });
  }

  // Persistent project order saved by the admin tool (projects-order.json).

  let projectOrder = {};

  // Student-edited content (data/overrides.json) — bio, practices and

  let studentOverride = {};

  function renderProjects(row) {
    const files = MANIFEST[name] || [];
    let groups = projectGroups(name, files);

    // Reorder groups by the saved order for this student. Groups whose
    // storage key appears in the order array come first (in that order);
    // any remaining groups keep their existing order.
    const order = projectOrder[name];
    if (Array.isArray(order) && order.length) {
      const indexOf = k => {
        const i = order.indexOf(k);
        return i < 0 ? Infinity : i;
      };
      groups = groups
        .map((g, i) => ({ g, i }))
        .sort((a, b) => {
          const oa = indexOf(a.g.key), ob = indexOf(b.g.key);
          return oa - ob || a.i - b.i;
        })
        .map(x => x.g);

    const container = document.getElementById('projects');

    const ovDescs = studentOverride.projectDescriptions || {};
    groups.forEach((group, i) => {
      let desc = ovDescs[group.base];
      if (desc == null || desc === '') desc = lookupDesc(row, name, group.base, i);
      if (!group.files.length && !desc) return;

      const article = document.createElement('article');
      article.className = 'project';

      const titleEl = document.createElement('h2');
      titleEl.className = 'label label-project';
      // Project titles: "-" reads as a space, "_" reads as a "-" (so a real
      // dash in a name like "Non-Consensual Intelligence" is stored with "_").
      titleEl.textContent = group.base.replace(/-/g, ' ').replace(/_/g, '-');
      article.appendChild(titleEl);

      if (group.files.length) {
        const imagesDiv = document.createElement('div');
        imagesDiv.className = 'images';
        for (const file of group.files) {
          if (/\.url$/i.test(file)) {
            imagesDiv.appendChild(makeVideoEmbed(file));
            continue;
          }
          const img = document.createElement('img');
          img.src = enc(`/Student Work/Projects/${file}`);
          img.alt = '';
          img.loading = 'lazy';
          img.decoding = 'async';
          imagesDiv.appendChild(img);
        }
        article.appendChild(imagesDiv);
      }

      if (desc) {
        const p = document.createElement('p');
        p.className = 'project-desc';
        p.textContent = desc;
        article.appendChild(p);
      }

      container.appendChild(article);
    });
  }

  // Match the slug to the sheet's Name column. Tries exact match, then a
  // first-token match (so "Anand Macwan" in the sheet matches slug "anand").
  function matchRow(objs, slug) {
    const target = slug.toLowerCase();
    return objs.find(o => {
      const n = field(o, 'Name').toLowerCase().trim();
      if (!n) return false;
      if (n === target) return true;
      const first = n.split(/\s+/)[0];
      return first === target;
    }) || null;
  }

  // Cache-bust so Google re-serves the published CSV (otherwise we sometimes
  // get a stale or empty version edge-cached by them).
  const sheetUrl = SHEET_URL + (SHEET_URL.includes('?') ? '&' : '?') + 't=' + Date.now();

  // Fetch the saved project order (admin tool writes projects-order.json).
  // On 404 or any error, fall back to {} so default ordering is used.
  const orderUrl = enc('/Student Work/projects-order.json') + '?t=' + Date.now();
  const orderPromise = fetch(orderUrl, { cache: 'no-store' })
    .then(r => (r.ok ? r.json() : {}))
    .then(data => { if (data && typeof data === 'object') projectOrder = data; })
    .catch(() => { projectOrder = {}; });

  // Fetch student-edited overrides (data/overrides.json). Missing file or
  // any error falls back to {} so the sheet values are used.
  const overridesPromise = fetch('/data/overrides.json?t=' + Date.now(), { cache: 'no-store' })
    .then(r => (r.ok ? r.json() : {}))
    .then(data => {
      if (data && typeof data === 'object' && data[name] && typeof data[name] === 'object') {
        studentOverride = data[name];
      }
    })
    .catch(() => { studentOverride = {}; });

  Promise.all([orderPromise, overridesPromise]).then(() =>
  fetch(sheetUrl, { cache: 'no-store' })
    .then(r => {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.text();
    })
    .then(text => {
      const rows = parseCSV(text);
      const objs = toObjects(rows);
      const row = matchRow(objs, name);
      renderBasic(row);
      renderProjects(row);
    })
    .catch(err => {
      console.error('[OTF] Sheet fetch failed:', err);
      renderBasic(null);
      renderProjects(null);
      const notice = document.createElement('p');
      notice.className = 'state';
      notice.style.position = 'static';
      notice.style.inset = 'auto';
      notice.style.color = 'var(--muted)';
      notice.style.margin = '2rem auto';
      notice.textContent = "Couldn't load profile";
      portfolioEl.appendChild(notice);
    })
  );
})();
</script>
</body>
</html>
