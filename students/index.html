<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OTF — Student Portfolio</title>
<meta name="description" content="A student portfolio from BA (Hons) Graphic Design, Ravensbourne University London.">
<meta name="theme-color" content="#ffffff">
<meta property="og:title" content="OTF — Student Portfolio">
<meta property="og:description" content="A student portfolio from BA (Hons) Graphic Design, Ravensbourne University London.">
<meta property="og:image" content="https://otfshow.anandmacwan123.workers.dev/Favicon.jpg">
<meta property="og:image:type" content="image/jpeg">
<meta property="og:image:alt" content="OTF — Ravensbourne Graphic Design Show">
<meta property="og:type" content="profile">
<meta property="og:site_name" content="OTF">
<meta property="og:locale" content="en_GB">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="OTF — Student Portfolio">
<meta name="twitter:description" content="A student portfolio from BA (Hons) Graphic Design, Ravensbourne University London.">
<meta name="twitter:image" content="https://otfshow.anandmacwan123.workers.dev/Favicon.jpg">
<link rel="icon" type="image/jpeg" href="/Favicon.jpg">
<link rel="apple-touch-icon" href="/Favicon.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #fff;
    --fg: #000;
    --muted: #6a6a6a;
    --col-text: 540px;
    --col-image: 960px;
  }

  html, body {
    background: var(--bg);
    font-family: 'IBM Plex Sans', system-ui, sans-serif;
    color: var(--fg);
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  body {
    min-height: 100vh;
    min-height: 100dvh;
    padding: 6vh 5vw 8rem;
  }

  .portfolio[hidden] { display: none; }

  .state {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 500;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    font-size: 0.85rem;
    color: var(--muted);
  }

  .hero {
    margin: 0 0 7rem;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: clamp(1.5rem, 4vw, 4rem);
    align-items: end;
  }

  .hero-left { display: flex; justify-content: flex-start; }

  .hero-headshot-wrap {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
  }

  /* Display labels — student name (headshot) and project titles. A colored
     container with the title text, rendered in HTML rather than baked into
     the image. Sits flush on top of the image, top-left aligned. */
  .label {
    display: inline-flex;
    align-self: flex-start;
    padding: 0 2px;
    justify-content: center;
    align-items: center;
    gap: 10px;
    font-family: 'IBM Plex Sans', system-ui, sans-serif;
    font-size: 16px;
    font-weight: 700;
    line-height: normal;
    letter-spacing: -0.12em;
    text-transform: uppercase;
  }
  .label-headshot { background: #FC1233; color: #000; }
  .label-project  { background: #000;    color: #fff; }

  .hero-right {
    display: flex;
    flex-direction: column;
    gap: 1.5rem;
    max-width: var(--col-text);
  }

  .hero-media {
    display: flex;
    align-items: flex-end;
    gap: 1.25rem;
  }

  .hero-headshot {
    height: clamp(280px, 50vh, 560px);
    width: auto;
    display: block;
    flex-shrink: 0;
  }

  .hero-practices {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 0.5rem;
    padding-bottom: 0.75rem;
    font-weight: 500;
    font-size: clamp(0.475rem, 0.55vw + 0.275rem, 0.6rem);
    line-height: 1.25;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--fg);
  }

  .bio {
    font-size: clamp(1rem, 0.4vw + 0.85rem, 1.0625rem);
    line-height: 1.55;
    letter-spacing: -0.01em;
  }

  .bio p + p { margin-top: 1rem; }

  .socials {
    display: flex;
    gap: clamp(1rem, 2.5vw, 2.5rem);
    flex-wrap: wrap;
  }
  .socials a {
    color: #000;
    text-decoration: none;
    font-weight: 500;
    font-size: clamp(0.475rem, 0.55vw + 0.275rem, 0.6rem);
    line-height: 1.25;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    transition: opacity 0.2s ease;
  }
  .socials a:hover { opacity: 0.55; }

  .projects {
    display: flex;
    flex-direction: column;
    gap: 7rem;
    margin: 0;
  }

  .project { display: flex; flex-direction: column; }

  .project .images {
    display: flex;
    flex-direction: row;
    gap: 1rem;
    overflow-x: auto;
    overflow-y: hidden;
    /* Extend beyond body padding so scrollable strip reaches viewport edge */
    margin: 0 -5vw;
    padding: 0 5vw 0.5rem;
    scrollbar-width: thin;
  }

  .project .images img {
    height: clamp(280px, 50vh, 480px);
    width: auto;
    display: block;
    flex-shrink: 0;
  }

  .project-desc {
    max-width: var(--col-text);
    margin: 1.25rem 0 0;
    font-size: clamp(1rem, 0.4vw + 0.85rem, 1.0625rem);
    line-height: 1.55;
    letter-spacing: -0.01em;
  }

  @media (max-width: 720px) {
    .hero { grid-template-columns: 1fr; align-items: start; }
    .hero-right { max-width: none; }
    /* Stack the practices below the headshot. */
    .hero-media { flex-direction: column; align-items: flex-start; gap: 0.75rem; width: 100%; }
    .hero-headshot-wrap { width: 100%; }
    /* Headshot fills the column so body padding is equal on both sides. */
    .hero-headshot { width: 100%; height: auto; }
    /* Project images scaled down to 0.6x. */
    .project .images img { height: clamp(168px, 30vh, 288px); }
    .nav a { font-size: clamp(0.7125rem, 0.825vw + 0.4125rem, 0.9rem); }
  }

  .nav {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    display: flex;
    justify-content: center;
    gap: clamp(1.5rem, 5vw, 4rem);
    z-index: 10;
    padding: 1rem 4vw;
    background: var(--bg);
  }
  .nav a {
    color: #000;
    text-decoration: none;
    font-weight: 500;
    font-size: clamp(0.475rem, 0.55vw + 0.275rem, 0.6rem);
    line-height: 1.25;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    transition: opacity 0.2s ease;
  }
  .nav a:hover { opacity: 0.55; }

  .sr-only {
    position: absolute;
    width: 1px;
    height: 1px;
    padding: 0;
    margin: -1px;
    overflow: hidden;
    clip: rect(0, 0, 0, 0);
    white-space: nowrap;
    border: 0;
  }
</style>
</head>
<body>
  <p class="state" id="state">Loading…</p>

  <main class="portfolio" id="portfolio" hidden>
    <header class="hero">
      <div class="hero-left">
        <div class="hero-media">
          <div class="hero-headshot-wrap">
            <div class="label label-headshot" id="heroName"></div>
            <img class="hero-headshot" id="heroHeadshot" alt="">
          </div>
          <p class="hero-practices" id="heroPractices"></p>
        </div>
      </div>
      <div class="hero-right">
        <section class="bio" id="bio"></section>
        <nav class="socials" id="socials" aria-label="Student links"></nav>
      </div>
    </header>
    <section class="projects" id="projects"></section>
  </main>

  <nav class="nav" aria-label="Primary">
    <a href="/showcase/">[SHOWCASE]</a>
    <a href="/visit/">[VISIT]</a>
    <a href="/info/">[INFO]</a>
    <a href="/index/">[INDEX]</a>
  </nav>

<script>
(() => {
  // __MANIFEST_START__
    const MANIFEST = {
      "Anand": ["Anand_Based.webp", "Anand_Evolving.webp", "Anand_NCI.webp", "Anand_RaveBadge.webp", "Anand_ThinkingBlock.webp"],
      "Arnete": ["Arnete_Aqva.webp", "Arnete_Atsijungti.webp", "Arnete_InthePresenceofGreen.webp", "Arnete_Postcard Series.webp"],
      "Becky": ["Becky_Kopparberg1.webp", "Becky_Kopparberg2-1.webp", "Becky_Kopparberg2.webp"],
      "Carolina": ["Carolina_Aqua.webp", "Carolina_Packaging.webp", "Carolina_Zine.webp"],
      "Charles": ["Charles_Agneshouse.webp", "Charles_KpopZine.webp", "Charles_TMS.webp"],
      "Darcy": ["Darcy_Untitled.webp"],
      "Divine": ["Divine_ABOTABOT.webp", "Divine_TerraCotta.webp", "Divine_UntitledZine.webp"],
      "Elise": ["Elise_Tera1.webp", "Elise_Tera2.webp", "Elise_Tera3.webp"],
      "Emily": ["Emily_4THGENZine.webp", "Emily_Globular.webp", "Emily_Sign.webp"],
      "Jaeden": ["Jaeden_FameSucks.webp", "Jaeden_FameSucks1.webp", "Jaeden_FameSucks2.webp"],
      "Jamie": ["Jamie_HemDuyen.webp", "Jamie_Kynexus.webp"],
      "Jenna": ["Jenna_Aer.webp", "Jenna_Privacy Matters.webp", "Jenna_Veil.webp"],
      "Jess": ["Jess_Aqya.webp", "Jess_CFTSOC.webp", "Jess_Untitled.webp"],
      "Kami": ["Kami_FOOF1.webp", "Kami_FOOF2.webp", "Kami_FOOF3.webp"],
      "Kye": ["Kye_HeadphonesAd.webp", "Kye_IncensePackaging.webp", "Kye_Untitled.webp"],
      "Martim": ["Martim_5PP.webp", "Martim_B33ChairPoster.webp", "Martim_Reflections.webp"],
      "Maseray": ["Maseray_IgnisStudios.webp", "Maseray_LordandSaviour.webp", "Maseray_ThedesignersArchive.webp"],
      "Nikol": ["Nikol_Aquari.webp", "Nikol_CREATEPoster.webp", "Nikol_WWTPLUposter.webp"],
      "Noora": ["Noora_Lipstick.webp", "Noora_PFI.webp", "Noora_RP.webp"],
      "Nora": ["Nora_Overstack.webp", "Nora_PhobiaFiles.webp", "Nora_ShakenNotStirred.webp", "Nora_ShakenNotStirred2.webp", "Nora_SmultringerPhotography.webp", "Nora_SmultringerPhotography2.webp"]
    };
    // __MANIFEST_END__

  const SHEET_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTxvTorU4JVoWJPpqxRsiM5SllpkB9mI8oEtaIfX4KYS804dlL6HMo6r97-BHYqhA/pub?output=csv';
  const stateEl = document.getElementById('state');
  const portfolioEl = document.getElementById('portfolio');

  function fail(msg) { stateEl.textContent = msg; }

  const enc = p => p.split('/').map(encodeURIComponent).join('/');

  // Resolve slug to canonical student name from MANIFEST keys
  const slug = decodeURIComponent(location.pathname).replace(/^\/students\/?/, '').replace(/\/$/, '').toLowerCase();
  if (!slug) { fail('Student not found'); return; }
  const name = Object.keys(MANIFEST).find(n => n.toLowerCase() === slug);
  if (!name) { fail('Student not found'); return; }

  // CSV/TSV parser — quoted fields, doubled-quote escape, CRLF/LF newlines.
  // Auto-detects delimiter by sampling the first 5 lines.
  function parseCSV(text) {
    const sample = text.split(/\r?\n/).slice(0, 5).join('\n');
    const tabs = (sample.match(/\t/g) || []).length;
    const commas = (sample.match(/,/g) || []).length;
    const delim = tabs > commas ? '\t' : ',';
    const rows = [];
    let row = [], field = '', inQuotes = false;
    for (let i = 0; i < text.length; i++) {
      const c = text[i];
      if (inQuotes) {
        if (c === '"') {
          if (text[i + 1] === '"') { field += '"'; i++; }
          else { inQuotes = false; }
        } else { field += c; }
      } else if (c === '"') {
        inQuotes = true;
      } else if (c === delim) {
        row.push(field); field = '';
      } else if (c === '\n' || c === '\r') {
        if (c === '\r' && text[i + 1] === '\n') i++;
        row.push(field); rows.push(row);
        row = []; field = '';
      } else { field += c; }
    }
    if (field.length || row.length) { row.push(field); rows.push(row); }
    return rows;
  }

  // The published sheet exports a row of "#,#,#,..." instead of real headers,
  // so we use a hardcoded schema (column order confirmed by the user).
  const COLUMNS = [
    '#',                                  // 0
    'Headshot',                           // 1
    'Name',                               // 2
    'Name translated',                    // 3
    'Language',                           // 4
    'Confidence',                         // 5
    'Notes',                              // 6
    'Bio',                                // 7
    'Bio translated',                     // 8
    'Project images (link)',              // 9
    'Project description 1',              // 10
    'Project description 1 translated',   // 11
    'Project description 2',              // 12
    'Project description 2 translated',   // 13
    'Project description 3',              // 14
    'Project description 3 translated',   // 15
    'Project description 4',              // 16
    'Project description 4 translated',   // 17
    'Project description 5',              // 18
    'Project description 5 translated',   // 19
  ];

  // Convert raw CSV rows to objects. If the first row contains a real "Name"
  // cell, use the CSV's own headers; otherwise fall back to the hardcoded
  // COLUMNS schema and skip a placeholder row (e.g. "#,#,#,...") if present.
  function toObjects(rows) {
    if (!rows.length) return [];
    const hasRealHeader = rows[0].some(c => c && c.trim().toLowerCase() === 'name');
    let headers, dataStart;
    if (hasRealHeader) {
      headers = rows[0].map(h => h.trim());
      dataStart = 1;
    } else {
      headers = COLUMNS;
      const placeholder = rows[0].every(c => !c.trim() || c.trim() === '#');
      dataStart = placeholder ? 1 : 0;
    }
    return rows.slice(dataStart)
      .filter(r => r.some(c => c && c.trim()))
      .map(r => {
        const o = {};
        headers.forEach((h, i) => { o[h] = (r[i] ?? '').trim(); });
        return o;
      });
  }

  // Group project filenames into projects keyed by storage name.
  // New convention: <Student>_<Project>_<N>.webp — group by <Project>, order by <N>.
  // Legacy files (no `_<N>` tail) fall back to stripping trailing digits so
  // pre-rename batches like FameSucks / FameSucks1 / FameSucks2 still group.
  // Skips Unassigned, collapses Untitled<K> → "Untitled".
  function projectGroups(name, files) {
    const prefixRe = new RegExp('^' + name.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '_');
    const order = [];
    const groups = new Map();
    for (const file of files) {
      const stem = file.replace(/\.webp$/i, '').replace(prefixRe, '');
      let project, n;
      const m = stem.match(/^(.+)_(\d+)$/);
      if (m) {
        project = m[1];
        n = +m[2];
      } else {
        const numMatch = stem.match(/(\d+)(?:-\d+)?$/);
        n = numMatch ? +numMatch[1] : 0;
        project = stem.replace(/\d+(?:-\d+)?$/, '') || stem;
      }
      if (project === 'Unassigned') continue;
      const displayName = /^Untitled\d*$/.test(project) ? 'Untitled' : project;
      if (!groups.has(project)) { groups.set(project, { displayName, files: [] }); order.push(project); }
      groups.get(project).files.push({ file, n });
    }
    for (const g of groups.values()) g.files.sort((a, b) => a.n - b.n || a.file.localeCompare(b.file));
    return order.map(p => ({ key: p, base: groups.get(p).displayName, files: groups.get(p).files.map(x => x.file) }));
  }

  // Look up a description for a project group. The sheet uses positional
  // columns: "Project description 1" .. "Project description 5". The base
  // name fallbacks below let the schema evolve later without code changes.
  function lookupDesc(row, name, base, index) {
    if (!row) return '';
    const candidates = [
      `Project description ${index + 1}`,
      `Project Description ${index + 1}`,
      `Project${index + 1}_Desc`,
      base,
      `${base}_Desc`,
      `${name}_${base}`,
    ];
    const keys = Object.keys(row);
    for (const cand of candidates) {
      const key = keys.find(k => k.toLowerCase() === cand.toLowerCase());
      if (key && row[key]) return row[key];
    }
    return '';
  }

  // Case-insensitive column getter — sheet headers occasionally have stray
  // casing or whitespace.
  function field(row, ...names) {
    if (!row) return '';
    const keys = Object.keys(row);
    for (const n of names) {
      const k = keys.find(k => k.toLowerCase() === n.toLowerCase());
      if (k && row[k]) return row[k];
    }
    return '';
  }

  function renderBasic(row) {
    const hs = document.getElementById('heroHeadshot');
    hs.src = enc(`/Student Work/Headshots/${name}.webp`);
    hs.alt = `${name} — portrait`;
    hs.onerror = () => { hs.remove(); };

    // Headshot label — student's full name from the sheet's "Name" column.
    document.getElementById('heroName').textContent = field(row, 'Name') || name;

    const practices = row
      ? [field(row, 'Practice1'), field(row, 'Practice2'), field(row, 'Practice3')]
          .filter(p => p && p.length)
      : [];
    const practicesEl = document.getElementById('heroPractices');
    if (practices.length) {
      for (const p of practices) {
        const span = document.createElement('span');
        span.textContent = p;
        practicesEl.appendChild(span);
      }
    } else {
      practicesEl.remove();
    }

    const bioEl = document.getElementById('bio');
    const bioText = field(row, 'Bio');
    if (bioText) {
      for (const para of bioText.split(/\n{2,}|\r\n\r\n/)) {
        const p = document.createElement('p');
        p.textContent = para.trim();
        if (p.textContent) bioEl.appendChild(p);
      }
    } else {
      bioEl.remove();
    }

    const socialsEl = document.getElementById('socials');
    const socialLinks = [
      { label: 'PORTFOLIO', url: field(row, 'Portfolio', 'Portfolio URL', 'Website') },
      { label: 'INSTAGRAM', url: field(row, 'Instagram', 'Instagram URL') },
      { label: 'LINKEDIN',  url: field(row, 'LinkedIn', 'Linkedin', 'LinkedIn URL') },
    ];
    let hasSocial = false;
    for (const { label, url } of socialLinks) {
      if (!url) continue;
      hasSocial = true;
      const href = /^https?:\/\//i.test(url) ? url : 'https://' + url;
      const a = document.createElement('a');
      a.href = href;
      a.target = '_blank';
      a.rel = 'noopener';
      a.textContent = `[${label}]`;
      socialsEl.appendChild(a);
    }
    if (!hasSocial) socialsEl.remove();

    document.title = `${name} — OTF`;
    const setMeta = (sel, value) => {
      const el = document.querySelector(sel);
      if (el) el.setAttribute('content', value);
    };
    setMeta('meta[property="og:title"]', `${name} — OTF`);
    setMeta('meta[name="twitter:title"]', `${name} — OTF`);

    portfolioEl.hidden = false;
    stateEl.remove();
  }

  // Persistent project order saved by the admin tool (projects-order.json).
  // Populated before renderProjects runs; defaults to {} on 404/error.
  let projectOrder = {};

  function renderProjects(row) {
    const files = MANIFEST[name] || [];
    let groups = projectGroups(name, files);

    // Reorder groups by the saved order for this student. Groups whose
    // storage key appears in the order array come first (in that order);
    // any remaining groups keep their existing order.
    const order = projectOrder[name];
    if (Array.isArray(order) && order.length) {
      const indexOf = k => {
        const i = order.indexOf(k);
        return i < 0 ? Infinity : i;
      };
      groups = groups
        .map((g, i) => ({ g, i }))
        .sort((a, b) => {
          const oa = indexOf(a.g.key), ob = indexOf(b.g.key);
          return oa - ob || a.i - b.i;
        })
        .map(x => x.g);
    }

    const container = document.getElementById('projects');

    groups.forEach((group, i) => {
      const desc = lookupDesc(row, name, group.base, i);
      if (!group.files.length && !desc) return;

      const article = document.createElement('article');
      article.className = 'project';

      const titleEl = document.createElement('h2');
      titleEl.className = 'label label-project';
      titleEl.textContent = group.base;
      article.appendChild(titleEl);

      if (group.files.length) {
        const imagesDiv = document.createElement('div');
        imagesDiv.className = 'images';
        for (const file of group.files) {
          const img = document.createElement('img');
          img.src = enc(`/Student Work/Projects/${file}`);
          img.alt = '';
          img.loading = 'lazy';
          imagesDiv.appendChild(img);
        }
        article.appendChild(imagesDiv);
      }

      if (desc) {
        const p = document.createElement('p');
        p.className = 'project-desc';
        p.textContent = desc;
        article.appendChild(p);
      }

      container.appendChild(article);
    });
  }

  // Match the slug to the sheet's Name column. Tries exact match, then a
  // first-token match (so "Anand Macwan" in the sheet matches slug "anand").
  function matchRow(objs, slug) {
    const target = slug.toLowerCase();
    return objs.find(o => {
      const n = field(o, 'Name').toLowerCase().trim();
      if (!n) return false;
      if (n === target) return true;
      const first = n.split(/\s+/)[0];
      return first === target;
    }) || null;
  }

  // Cache-bust so Google re-serves the published CSV (otherwise we sometimes
  // get a stale or empty version edge-cached by them).
  const sheetUrl = SHEET_URL + (SHEET_URL.includes('?') ? '&' : '?') + 't=' + Date.now();

  // Fetch the saved project order (admin tool writes projects-order.json).
  // On 404 or any error, fall back to {} so default ordering is used.
  const orderUrl = enc('/Student Work/projects-order.json') + '?t=' + Date.now();
  const orderPromise = fetch(orderUrl, { cache: 'no-store' })
    .then(r => (r.ok ? r.json() : {}))
    .then(data => { if (data && typeof data === 'object') projectOrder = data; })
    .catch(() => { projectOrder = {}; });

  orderPromise.then(() =>
  fetch(sheetUrl, { cache: 'no-store' })
    .then(r => {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.text();
    })
    .then(text => {
      const rows = parseCSV(text);
      const objs = toObjects(rows);
      const row = matchRow(objs, name);
      renderBasic(row);
      renderProjects(row);
    })
    .catch(err => {
      console.error('[OTF] Sheet fetch failed:', err);
      renderBasic(null);
      renderProjects(null);
      const notice = document.createElement('p');
      notice.className = 'state';
      notice.style.position = 'static';
      notice.style.inset = 'auto';
      notice.style.color = 'var(--muted)';
      notice.style.margin = '2rem auto';
      notice.textContent = "Couldn't load profile";
      portfolioEl.appendChild(notice);
    })
  );
})();
</script>
