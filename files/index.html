<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>OTF Library</title>
<link rel="icon" type="image/jpeg" href="/Favicon.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #fff;
    --fg: #000;
    --muted: #6a6a6a;
    --border: rgba(0,0,0,0.1);
    --sidebar-w: 180px;
    --header-h: 48px;
    --red: #FF002F;
  }

  html, body {
    height: 100%;
    background: var(--bg);
    font-family: 'IBM Plex Sans', system-ui, sans-serif;
    color: var(--fg);
    -webkit-font-smoothing: antialiased;
    font-size: 14px;
  }

  /* ── PAT prompt overlay ────────────────────────────────────────────── */
  #patPrompt {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
    background: var(--bg);
    z-index: 100;
  }
  #patPrompt[hidden] { display: none; }

  .pat-form {
    width: 100%; max-width: 360px;
    display: flex; flex-direction: column; gap: 1rem;
    padding: 0 2rem;
  }
  .pat-title {
    font-size: 0.6rem; font-weight: 500;
    letter-spacing: 0.04em; text-transform: uppercase;
  }
  .pat-hint {
    font-size: 0.75rem; color: var(--muted); line-height: 1.5;
  }
  .pat-hint a { color: var(--fg); }
  .pat-form input[type="password"] {
    width: 100%; padding: 0.6rem 0;
    border: none; border-bottom: 1px solid var(--border);
    background: none; font: inherit; font-size: 1rem;
    letter-spacing: -0.01em; outline: none;
  }
  .pat-form button {
    align-self: flex-start;
    padding: 0.5rem 1.25rem;
    background: var(--fg); color: var(--bg);
    border: none; font: inherit;
    font-size: 0.6rem; font-weight: 500;
    letter-spacing: 0.04em; text-transform: uppercase;
    cursor: pointer;
  }
  .pat-form button:hover { opacity: 0.75; }
  .pat-error {
    font-size: 0.7rem; color: var(--red);
    letter-spacing: 0.02em; min-height: 1rem;
  }

  /* ── App shell ─────────────────────────────────────────────────────── */
  #app { display: flex; flex-direction: column; height: 100%; }
  #app[hidden] { display: none; }

  /* Header */
  .app-header {
    height: var(--header-h);
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 1.25rem;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  .app-header h1 {
    font-size: 0.6rem; font-weight: 500;
    letter-spacing: 0.04em; text-transform: uppercase;
  }
  .header-right {
    display: flex; align-items: center; gap: 1.5rem;
  }
  #status {
    font-size: 0.6rem; letter-spacing: 0.04em;
    text-transform: uppercase; color: var(--muted);
    min-width: 6rem; text-align: right;
  }
  .sign-out-btn {
    font: inherit; font-size: 0.6rem; font-weight: 500;
    letter-spacing: 0.04em; text-transform: uppercase;
    background: none; border: none; cursor: pointer;
    color: var(--muted);
  }
  .sign-out-btn:hover { color: var(--fg); }

  /* Layout: sidebar + main */
  .app-body {
    display: flex; flex: 1; overflow: hidden;
  }

  /* Sidebar */
  #sidebar {
    width: var(--sidebar-w);
    border-right: 1px solid var(--border);
    overflow-y: auto; flex-shrink: 0;
    padding: 0.5rem 0;
  }
  .student-btn {
    display: block; width: 100%;
    padding: 0.55rem 1.25rem;
    text-align: left; background: none; border: none;
    font: inherit; font-size: 0.875rem;
    cursor: pointer; color: var(--fg);
    transition: background 0.1s;
  }
  .student-btn:hover { background: rgba(0,0,0,0.04); }
  .student-btn.active {
    background: var(--fg); color: var(--bg);
  }

  /* Main detail area */
  #detail {
    flex: 1; overflow-y: auto;
    padding: 1.5rem 2rem 4rem;
  }
  .hint {
    color: var(--muted); font-size: 0.875rem;
    padding-top: 2rem; text-align: center;
  }

  /* Detail section */
  .detail-section { margin-bottom: 2.5rem; }
  .detail-section h2 {
    font-size: 0.6rem; font-weight: 500;
    letter-spacing: 0.04em; text-transform: uppercase;
    color: var(--muted); margin-bottom: 1rem;
    padding-bottom: 0.5rem;
    border-bottom: 1px solid var(--border);
  }

  /* File grid */
  .file-grid {
    display: flex; flex-wrap: wrap; gap: 1rem;
    align-items: flex-start;
  }

  /* File card */
  .file-card {
    width: 140px; display: flex; flex-direction: column; gap: 0.5rem;
  }

  /* Thumbnail */
  .thumb {
    width: 140px; height: 140px;
    background: rgba(0,0,0,0.04);
    overflow: hidden; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
  }
  .thumb img {
    width: 100%; height: 100%; object-fit: cover; display: block;
  }
  .thumb-video { background: rgba(0,0,0,0.08); }
  .video-icon {
    font-size: 1.5rem; color: var(--muted);
  }

  .filename {
    font-size: 0.7rem; color: var(--muted);
    word-break: break-all; line-height: 1.3;
  }

  /* Actions */
  .actions { display: flex; flex-wrap: wrap; gap: 0.35rem; }
  .act-btn {
    font: inherit; font-size: 0.55rem; font-weight: 500;
    letter-spacing: 0.04em; text-transform: uppercase;
    background: none; border: 1px solid var(--border);
    padding: 0.25rem 0.5rem; cursor: pointer; color: var(--fg);
    white-space: nowrap;
  }
  .act-btn:hover { background: rgba(0,0,0,0.05); }
  .act-del { color: var(--red); border-color: rgba(255,0,47,0.25); }
  .act-del:hover { background: rgba(255,0,47,0.05); }

  /* Rename inline */
  .rename-wrap {
    display: flex; align-items: center;
    font-size: 0.7rem;
    border-bottom: 1px solid var(--fg);
    padding-bottom: 1px;
  }
  .rename-prefix { color: var(--muted); white-space: nowrap; }
  .rename-input {
    font: inherit; font-size: 0.7rem;
    background: none; border: none; outline: none;
    min-width: 0; flex: 1;
    color: var(--fg);
  }

  /* Drop zone */
  .drop-zone {
    width: 140px; height: 140px;
    border: 1px dashed var(--border);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; text-align: center;
    transition: border-color 0.15s, background 0.15s;
  }
  .drop-zone span {
    font-size: 0.65rem; color: var(--muted);
    line-height: 1.5; pointer-events: none;
  }
  .drop-zone:hover, .drop-zone.drag-over {
    border-color: var(--fg); background: rgba(0,0,0,0.02);
  }

  /* Modal */
  #modal {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.35);
    display: flex; align-items: center; justify-content: center;
    z-index: 200;
  }
  #modal[hidden] { display: none; }
  .modal-box {
    background: var(--bg); padding: 2rem;
    max-width: 340px; width: 90%;
    display: flex; flex-direction: column; gap: 1rem;
  }
  .modal-title {
    font-size: 0.875rem; font-weight: 500;
  }
  .modal-body {
    font-size: 0.8rem; color: var(--muted); line-height: 1.4;
  }
  .modal-actions { display: flex; gap: 0.75rem; }
  .modal-confirm {
    font: inherit; font-size: 0.6rem; font-weight: 500;
    letter-spacing: 0.04em; text-transform: uppercase;
    background: var(--fg); color: var(--bg);
    border: none; padding: 0.5rem 1rem; cursor: pointer;
  }
  .modal-cancel {
    font: inherit; font-size: 0.6rem; font-weight: 500;
    letter-spacing: 0.04em; text-transform: uppercase;
    background: none; border: 1px solid var(--border);
    padding: 0.5rem 1rem; cursor: pointer;
  }

  /* Loading skeleton shimmer */
  @keyframes shimmer {
    0% { opacity: 0.4; } 50% { opacity: 0.7; } 100% { opacity: 0.4; }
  }
  .loading { animation: shimmer 1.4s ease-in-out infinite; }

  /* ── Task bar (bottom-right) ──────────────────────────────────────── */
  #taskBar {
    position: fixed;
    bottom: 1.25rem;
    right: 1.25rem;
    min-width: 220px;
    max-width: 340px;
    background: var(--fg);
    color: var(--bg);
    padding: 0.75rem 1rem;
    z-index: 150;
    display: flex;
    flex-direction: column;
    gap: 0.4rem;
    box-shadow: 0 6px 24px rgba(0,0,0,0.18);
    transform: translateY(0);
    transition: opacity 0.25s ease, transform 0.25s ease;
  }
  #taskBar[hidden] {
    display: flex;
    opacity: 0;
    transform: translateY(0.5rem);
    pointer-events: none;
  }
  .task-label {
    font-size: 0.6rem; font-weight: 500;
    letter-spacing: 0.04em; text-transform: uppercase;
  }
  .task-detail {
    font-size: 0.7rem;
    color: rgba(255,255,255,0.65);
    word-break: break-all;
  }
  .task-progress {
    height: 2px; width: 100%;
    background: rgba(255,255,255,0.15);
    overflow: hidden; position: relative;
  }
  .task-progress::after {
    content: '';
    position: absolute; top: 0; left: 0; bottom: 0;
    width: 40%; background: rgba(255,255,255,0.9);
    animation: taskSlide 1.2s ease-in-out infinite;
  }
  @keyframes taskSlide {
    0% { left: -40%; } 100% { left: 100%; }
  }
  #taskBar.task-done .task-progress { display: none; }
  #taskBar.task-error { background: var(--red); }
</style>
</head>
<body>

<!-- PAT prompt -->
<div id="patPrompt">
  <form class="pat-form" id="patForm">
    <p class="pat-title">OTF Library</p>
    <p class="pat-hint">
      Paste a GitHub personal access token with
      <strong>contents:write</strong> access to this repo.
      <br><br>
      <a href="https://github.com/settings/tokens/new?description=OTF+Library&scopes=repo" target="_blank" rel="noopener">Create one on GitHub ↗</a>
    </p>
    <input type="password" id="patInput" placeholder="ghp_…" autocomplete="off" required>
    <div class="pat-error" id="patError"></div>
    <button type="submit">Continue</button>
  </form>
</div>

<!-- Main app -->
<div id="app" hidden>
  <header class="app-header">
    <h1>OTF Library</h1>
    <div class="header-right">
      <span id="status"></span>
      <button class="sign-out-btn" id="signOut">Sign out</button>
    </div>
  </header>
  <div class="app-body">
    <aside id="sidebar"></aside>
    <main id="detail"><p class="hint">Select a student</p></main>
  </div>
</div>

<!-- Bottom-right task bar -->
<div id="taskBar" hidden>
  <span class="task-label">Working…</span>
  <span class="task-detail"></span>
  <span class="task-progress"></span>
</div>

<!-- Confirmation modal -->
<div id="modal" hidden>
  <div class="modal-box">
    <p class="modal-title"></p>
    <p class="modal-body"></p>
    <div class="modal-actions">
      <button class="modal-confirm">Delete</button>
      <button class="modal-cancel">Cancel</button>
    </div>
  </div>
</div>

<script>
(() => {
  // ── Constants ──────────────────────────────────────────────────────
  const OWNER   = 'anandmacwan123-tech';
  const REPO    = 'OTF.Website';
  const BRANCH  = 'main';
  const HS_DIR  = 'Student Work/Headshots';
  const PR_DIR  = 'Student Work/Projects';
  const MANIFEST_PAGES = [
    'showcase/index.html',
    'students/index.html',
    'index/index.html',
  ];
  const SENT_START = '// __MANIFEST_START__';
  const SENT_END   = '// __MANIFEST_END__';
  const LS_PAT = 'otf_library_pat';

  // ── State ──────────────────────────────────────────────────────────
  let pat            = '';
  let headshots      = []; // { name, sha, downloadUrl, path }
  let projects       = []; // { name, sha, downloadUrl, path }
  let currentStudent = null;

  // ── DOM ────────────────────────────────────────────────────────────
  const $ = id => document.getElementById(id);
  const appEl        = $('app');
  const patPromptEl  = $('patPrompt');
  const sidebarEl    = $('sidebar');
  const detailEl     = $('detail');
  const statusEl     = $('status');
  const patForm      = $('patForm');
  const patInput     = $('patInput');
  const patError     = $('patError');
  const modalEl      = $('modal');

  function setStatus(msg) { statusEl.textContent = msg; }

  // ── GitHub API ─────────────────────────────────────────────────────
  async function gh(method, path, body) {
    const url = path.startsWith('http')
      ? path
      : `https://api.github.com/repos/${OWNER}/${REPO}${path}`;
    const res = await fetch(url, {
      method,
      headers: {
        Authorization: `Bearer ${pat}`,
        Accept: 'application/vnd.github+json',
        'Content-Type': 'application/json',
        'X-GitHub-Api-Version': '2022-11-28',
      },
      body: body != null ? JSON.stringify(body) : undefined,
    });
    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      const e = new Error(`GitHub ${res.status}: ${err.message || path}`);
      e.status = res.status;
      throw e;
    }
    return res.json();
  }

  function encPath(p) {
    // Encode path segments but keep slashes
    return p.split('/').map(encodeURIComponent).join('/');
  }

  async function ghContents(dir) {
    return gh('GET', `/contents/${encPath(dir)}?ref=${BRANCH}`);
  }

  async function ghBlob(base64) {
    const r = await gh('POST', '/git/blobs', { content: base64, encoding: 'base64' });
    return r.sha;
  }

  // ── Fetch assets ───────────────────────────────────────────────────
  async function fetchAssets() {
    const [hs, pr] = await Promise.all([
      ghContents(HS_DIR),
      ghContents(PR_DIR),
    ]);
    const toFile = f => ({ name: f.name, sha: f.sha, downloadUrl: f.download_url, path: f.path });
    headshots = hs.filter(f => f.type === 'file').map(toFile);
    projects  = pr.filter(f => f.type === 'file').map(toFile);
  }

  function studentNames() {
    return headshots.map(h => h.name.replace(/\.[^.]+$/, '')).sort((a,b) => a.localeCompare(b));
  }
  function projectsFor(s) { return projects.filter(p => p.name.startsWith(s + '_')); }
  function headshotFor(s) { return headshots.find(h => h.name.replace(/\.[^.]+$/, '') === s) || null; }

  // ── Manifest (ported from scripts/generate-manifest.mjs) ──────────
  function computeManifest(hsNames, prNames) {
    const students = hsNames.map(f => f.replace(/\.webp$/i, '')).sort((a,b) => a.localeCompare(b));
    const grouped = {};
    for (const file of prNames) {
      const us = file.indexOf('_');
      if (us <= 0) continue;
      const prefix = file.slice(0, us);
      const key = students.find(s => s === prefix) ?? students.find(s => s.toLowerCase() === prefix.toLowerCase());
      if (!key) continue;
      (grouped[key] ??= []).push(file);
    }
    const manifest = {};
    for (const s of students) {
      manifest[s] = (grouped[s] ?? []).slice().sort((a,b) => a.localeCompare(b));
    }
    return manifest;
  }

  function renderManifestBlock(obj) {
    const keys = Object.keys(obj);
    const lines = ['const MANIFEST = {'];
    keys.forEach((k, i) => {
      const arr = obj[k];
      const vals = '[' + arr.map(f => JSON.stringify(f)).join(', ') + ']';
      lines.push(`      ${JSON.stringify(k)}: ${vals}${i < keys.length - 1 ? ',' : ''}`);
    });
    lines.push('    };');
    return lines.join('\n');
  }

  // base64 encode / decode with full UTF-8 support
  function b64encode(str) {
    return btoa(Array.from(new TextEncoder().encode(str), b => String.fromCharCode(b)).join(''));
  }
  function b64decode(b64) {
    return new TextDecoder().decode(Uint8Array.from(atob(b64.replace(/\n/g, '')), c => c.charCodeAt(0)));
  }

  async function fetchManifestBlobs(afterHsNames, afterPrNames) {
    const manifest = computeManifest(afterHsNames, afterPrNames);
    const block = renderManifestBlock(manifest);
    const re = new RegExp(
      '(' + SENT_START.replace(/\//g, '\\/') + ')([\\s\\S]*?)(' + SENT_END.replace(/\//g, '\\/') + ')'
    );
    return Promise.all(MANIFEST_PAGES.map(async pagePath => {
      const data = await gh('GET', `/contents/${encPath(pagePath)}?ref=${BRANCH}`);
      const decoded = b64decode(data.content);
      const updated = decoded.replace(re, `$1\n    ${block}\n    $3`);
      const sha = await ghBlob(b64encode(updated));
      return { path: pagePath, sha };
    }));
  }

  // ── Atomic commit ──────────────────────────────────────────────────
  // changes: [{ path, content? (base64 file bytes), sha? (existing blob), delete? }]
  async function atomicCommit(changes, message) {
    // Compute after-state for manifest
    const afterHs = headshots.map(f => f.name);
    const afterPr = projects.map(f => f.name);
    for (const c of changes) {
      const inHs = c.path.startsWith(HS_DIR + '/');
      const inPr = c.path.startsWith(PR_DIR + '/');
      if (!inHs && !inPr) continue;
      const fname = c.path.slice((inHs ? HS_DIR : PR_DIR).length + 1);
      const arr = inHs ? afterHs : afterPr;
      if (c.delete) {
        const i = arr.indexOf(fname); if (i !== -1) arr.splice(i, 1);
      } else if (!arr.includes(fname)) {
        arr.push(fname);
      }
    }

    // 1. Current ref
    const ref = await gh('GET', `/git/refs/heads/${BRANCH}`);
    const headSha = ref.object.sha;

    // 2. Parent commit + tree
    const parentCommit = await gh('GET', `/git/commits/${headSha}`);
    const baseTree = parentCommit.tree.sha;

    // 3. Create blobs for new file content
    const newBlobs = await Promise.all(
      changes.filter(c => c.content).map(async c => ({
        path: c.path,
        sha: await ghBlob(c.content),
      }))
    );

    // 4. Create updated manifest blobs
    const manifestBlobs = await fetchManifestBlobs(afterHs, afterPr);

    // 5. Build tree
    const treeEntries = [];
    for (const c of changes) {
      if (c.delete) {
        treeEntries.push({ path: c.path, mode: '100644', type: 'blob', sha: null });
      } else {
        const blob = newBlobs.find(b => b.path === c.path);
        treeEntries.push({ path: c.path, mode: '100644', type: 'blob', sha: blob ? blob.sha : c.sha });
      }
    }
    for (const mb of manifestBlobs) {
      treeEntries.push({ path: mb.path, mode: '100644', type: 'blob', sha: mb.sha });
    }

    // 6. New tree
    const newTree = await gh('POST', '/git/trees', { base_tree: baseTree, tree: treeEntries });

    // 7. New commit
    const newCommit = await gh('POST', '/git/commits', {
      message: `library: ${message}`,
      tree: newTree.sha,
      parents: [headSha],
    });

    // 8. Update ref
    await gh('PATCH', `/git/refs/heads/${BRANCH}`, { sha: newCommit.sha });
  }

  // ── File operations ────────────────────────────────────────────────
  function fileToBase64(file) {
    return new Promise((res, rej) => {
      const r = new FileReader();
      r.onload = () => res(r.result.split(',')[1]);
      r.onerror = rej;
      r.readAsDataURL(file);
    });
  }

  // ── Task bar ───────────────────────────────────────────────────────
  const taskBarEl = $('taskBar');
  const taskLabelEl = taskBarEl.querySelector('.task-label');
  const taskDetailEl = taskBarEl.querySelector('.task-detail');
  let taskHideTimer = null;

  function showTask(label, detail = '') {
    clearTimeout(taskHideTimer);
    taskBarEl.classList.remove('task-done', 'task-error');
    taskLabelEl.textContent = label;
    taskDetailEl.textContent = detail;
    taskBarEl.removeAttribute('hidden');
  }
  function finishTask(label, detail = '', isError = false) {
    clearTimeout(taskHideTimer);
    taskBarEl.classList.add(isError ? 'task-error' : 'task-done');
    taskLabelEl.textContent = label;
    taskDetailEl.textContent = detail;
    taskHideTimer = setTimeout(() => taskBarEl.setAttribute('hidden', ''), isError ? 4500 : 1800);
  }

  // ── JPG/JPEG → WebP conversion (browser canvas) ───────────────────
  function convertJpegToWebP(file, quality = 0.92) {
    return new Promise((resolve, reject) => {
      const url = URL.createObjectURL(file);
      const img = new Image();
      img.onload = () => {
        const canvas = document.createElement('canvas');
        canvas.width = img.naturalWidth;
        canvas.height = img.naturalHeight;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0);
        canvas.toBlob(blob => {
          URL.revokeObjectURL(url);
          if (!blob) return reject(new Error('WebP encoding failed'));
          const newName = file.name.replace(/\.(jpg|jpeg)$/i, '.webp');
          resolve(new File([blob], newName, { type: 'image/webp' }));
        }, 'image/webp', quality);
      };
      img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('Could not decode image')); };
      img.src = url;
    });
  }

  async function doUpload(fileList, student, isHeadshot) {
    const total = fileList.length;
    let idx = 0;
    for (const file of fileList) {
      idx++;
      const lower = file.name.toLowerCase();
      const isJpeg = /\.(jpg|jpeg)$/.test(lower);
      const isImg = /\.(jpg|jpeg|png|webp)$/.test(lower);
      const isVid = /\.(mp4|webm)$/.test(lower);
      if (!isImg && !isVid) { alert(`Unsupported file type: ${file.name}`); continue; }
      if (isHeadshot && !isJpeg && !lower.endsWith('.webp')) {
        alert(`Headshot must be .webp or .jpg — got ${file.name}.`); continue;
      }

      const counter = total > 1 ? `${idx}/${total} · ` : '';
      let workFile = file;
      try {
        if (isJpeg) {
          showTask(`${counter}Converting`, file.name);
          workFile = await convertJpegToWebP(file);
        }

        showTask(`${counter}Uploading`, workFile.name);
        const b64 = await fileToBase64(workFile);

        if (isHeadshot) {
          const path = `${HS_DIR}/${student}.webp`;
          await atomicCommit([{ path, content: b64 }], `replace headshot for ${student}`);
        } else {
          const ext = workFile.name.toLowerCase().match(/\.[^.]+$/)?.[0] || '';
          const suffix = workFile.name.slice(0, -ext.length).replace(/\s+/g, '-').replace(/[^A-Za-z0-9._-]/g, '');
          const newName = `${student}_${suffix}${ext}`;
          await atomicCommit([{ path: `${PR_DIR}/${newName}`, content: b64 }], `upload ${newName}`);
        }
        finishTask(`${counter}Uploaded ✓`, workFile.name);
        await refresh();
      } catch(e) {
        finishTask('Failed', e.message, true);
        return;
      }
    }
  }

  async function doRename(file, newSuffix) {
    const ext = file.name.match(/\.[^.]+$/)?.[0] || '';
    const student = currentStudent;
    const newName = `${student}_${newSuffix}${ext}`;
    if (newName === file.name) return;
    showTask('Renaming', `${file.name} → ${newName}`);
    try {
      await atomicCommit([
        { path: file.path, delete: true },
        { path: `${PR_DIR}/${newName}`, sha: file.sha },
      ], `rename ${file.name} → ${newName}`);
      finishTask('Renamed ✓', newName);
      await refresh();
    } catch(e) {
      finishTask('Rename failed', e.message, true);
    }
  }

  async function doDelete(file) {
    showTask('Deleting', file.name);
    try {
      await atomicCommit([{ path: file.path, delete: true }], `delete ${file.name}`);
      finishTask('Deleted ✓', file.name);
      await refresh();
    } catch(e) {
      finishTask('Delete failed', e.message, true);
    }
  }

  // ── Modal ──────────────────────────────────────────────────────────
  function showModal(title, body, onConfirm) {
    modalEl.querySelector('.modal-title').textContent = title;
    modalEl.querySelector('.modal-body').textContent = body;
    const btn = modalEl.querySelector('.modal-confirm');
    const fresh = btn.cloneNode(true);
    btn.replaceWith(fresh);
    fresh.addEventListener('click', () => { hideModal(); onConfirm(); });
    modalEl.removeAttribute('hidden');
  }
  function hideModal() { modalEl.setAttribute('hidden', ''); }
  modalEl.querySelector('.modal-cancel').addEventListener('click', hideModal);

  // ── Render ─────────────────────────────────────────────────────────
  function renderSidebar() {
    sidebarEl.innerHTML = '';
    for (const name of studentNames()) {
      const btn = document.createElement('button');
      btn.className = 'student-btn' + (name === currentStudent ? ' active' : '');
      btn.textContent = name;
      btn.addEventListener('click', () => selectStudent(name));
      sidebarEl.appendChild(btn);
    }
  }

  function selectStudent(name) {
    currentStudent = name;
    renderSidebar();
    renderDetail();
  }

  function renderDetail() {
    detailEl.innerHTML = '';
    if (!currentStudent) { detailEl.innerHTML = '<p class="hint">Select a student</p>'; return; }
    const hs = headshotFor(currentStudent);
    const projs = projectsFor(currentStudent);
    detailEl.appendChild(makeSection('Headshot', hs ? [hs] : [], true));
    detailEl.appendChild(makeSection('Projects', projs, false));
  }

  function makeSection(title, files, isHeadshot) {
    const sec = document.createElement('section');
    sec.className = 'detail-section';
    const h = document.createElement('h2');
    h.textContent = title;
    sec.appendChild(h);
    const grid = document.createElement('div');
    grid.className = 'file-grid';
    files.forEach(f => grid.appendChild(makeCard(f, isHeadshot)));
    if (!isHeadshot) grid.appendChild(makeDropZone());
    sec.appendChild(grid);
    return sec;
  }

  function makeCard(file, isHeadshot) {
    const card = document.createElement('div');
    card.className = 'file-card';

    // Thumb
    const thumb = document.createElement('div');
    thumb.className = 'thumb';
    const lower = file.name.toLowerCase();
    if (/\.(mp4|webm)$/.test(lower)) {
      thumb.classList.add('thumb-video');
      thumb.innerHTML = '<span class="video-icon">▶</span>';
    } else {
      const img = document.createElement('img');
      img.src = file.downloadUrl;
      img.alt = file.name;
      img.loading = 'lazy';
      thumb.appendChild(img);
    }
    card.appendChild(thumb);

    // Filename
    const fn = document.createElement('span');
    fn.className = 'filename';
    fn.textContent = file.name;
    card.appendChild(fn);

    // Actions
    const acts = document.createElement('div');
    acts.className = 'actions';

    if (isHeadshot) {
      const replBtn = mkBtn('⟲ Replace', () => {
        const inp = Object.assign(document.createElement('input'), {
          type: 'file', accept: '.webp,.jpg,.jpeg',
        });
        inp.addEventListener('change', () => doUpload(inp.files, currentStudent, true));
        inp.click();
      });
      acts.appendChild(replBtn);
    } else {
      acts.appendChild(mkBtn('✎ Rename', () => startRename(file, fn)));
    }

    const del = mkBtn('× Delete', () =>
      showModal(`Delete ${file.name}?`, 'This cannot be undone.', () => doDelete(file))
    );
    del.classList.add('act-del');
    acts.appendChild(del);
    card.appendChild(acts);
    return card;
  }

  function mkBtn(label, onClick) {
    const b = document.createElement('button');
    b.className = 'act-btn';
    b.textContent = label;
    b.addEventListener('click', onClick);
    return b;
  }

  function startRename(file, fnEl) {
    const ext = file.name.match(/\.[^.]+$/)?.[0] || '';
    const prefix = currentStudent + '_';
    const currentSuffix = file.name.slice(prefix.length, file.name.length - ext.length);

    const wrap = document.createElement('div');
    wrap.className = 'rename-wrap';
    const pre = document.createElement('span');
    pre.className = 'rename-prefix';
    pre.textContent = prefix;
    const inp = document.createElement('input');
    inp.className = 'rename-input';
    inp.type = 'text';
    inp.value = currentSuffix;
    wrap.append(pre, inp);
    fnEl.replaceWith(wrap);

    const card = wrap.closest('.file-card');
    const acts = card.querySelector('.actions');
    const okBtn = mkBtn('✓', commit);
    const noBtn = mkBtn('✕', cancel);
    acts.prepend(noBtn, okBtn);

    function cancel() { wrap.replaceWith(fnEl); okBtn.remove(); noBtn.remove(); }
    function commit() {
      const newSuffix = inp.value.trim().replace(/\s+/g, '-').replace(/[^A-Za-z0-9._-]/g, '');
      cancel();
      if (newSuffix) doRename(file, newSuffix);
    }
    inp.addEventListener('keydown', e => {
      if (e.key === 'Enter') commit();
      if (e.key === 'Escape') cancel();
    });
    inp.focus(); inp.select();
  }

  function makeDropZone() {
    const zone = document.createElement('div');
    zone.className = 'drop-zone';
    const lbl = document.createElement('span');
    lbl.textContent = '+ Drop files here\nor click to upload';
    zone.appendChild(lbl);

    const inp = Object.assign(document.createElement('input'), {
      type: 'file', multiple: true,
      accept: '.jpg,.jpeg,.png,.webp,.mp4,.webm',
      style: 'display:none',
    });
    zone.appendChild(inp);

    zone.addEventListener('click', e => { if (e.target !== inp) inp.click(); });
    inp.addEventListener('change', () => doUpload(inp.files, currentStudent, false));
    zone.addEventListener('dragover', e => { e.preventDefault(); zone.classList.add('drag-over'); });
    zone.addEventListener('dragleave', () => zone.classList.remove('drag-over'));
    zone.addEventListener('drop', e => {
      e.preventDefault(); zone.classList.remove('drag-over');
      doUpload(e.dataTransfer.files, currentStudent, false);
    });
    return zone;
  }

  // ── Refresh ────────────────────────────────────────────────────────
  async function refresh() {
    await fetchAssets();
    if (currentStudent && !studentNames().includes(currentStudent)) currentStudent = null;
    renderSidebar();
    renderDetail();
  }

  // ── Auth ───────────────────────────────────────────────────────────
  async function validatePat(token) {
    pat = token;
    try {
      await gh('GET', ''); // GET /repos/{owner}/{repo}
      return true;
    } catch { pat = ''; return false; }
  }

  async function enterApp() {
    patPromptEl.setAttribute('hidden', '');
    appEl.removeAttribute('hidden');
    setStatus('Loading…');
    try {
      await fetchAssets();
      renderSidebar();
      renderDetail();
      setStatus('');
    } catch(e) { setStatus('Error: ' + e.message); }
  }

  // ── Event wiring ───────────────────────────────────────────────────
  patForm.addEventListener('submit', async e => {
    e.preventDefault();
    const token = patInput.value.trim();
    if (!token) return;
    patError.textContent = 'Verifying…';
    const ok = await validatePat(token);
    if (ok) {
      localStorage.setItem(LS_PAT, token);
      patError.textContent = '';
      await enterApp();
    } else {
      patError.textContent = 'Invalid token or no access to this repo.';
    }
  });

  $('signOut').addEventListener('click', () => {
    localStorage.removeItem(LS_PAT);
    pat = ''; currentStudent = null;
    appEl.setAttribute('hidden', '');
    patPromptEl.removeAttribute('hidden');
    patInput.value = '';
  });

  // Auto-login if stored
  const stored = localStorage.getItem(LS_PAT);
  if (stored) {
    validatePat(stored).then(ok => {
      if (ok) { localStorage.setItem(LS_PAT, stored); enterApp(); }
      else localStorage.removeItem(LS_PAT);
    });
  }
})();
</script>
</body>
</html>
