<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>OTF Library</title>
<link rel="icon" type="image/jpeg" href="/Favicon.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #fff;
    --fg: #000;
    --muted: #6a6a6a;
    --border: rgba(0,0,0,0.1);
    --sidebar-w: 180px;
    --header-h: 48px;
    --red: #FF002F;
  }

  html, body {
    height: 100%;
    background: var(--bg);
    font-family: 'IBM Plex Sans', system-ui, sans-serif;
    color: var(--fg);
    -webkit-font-smoothing: antialiased;
    font-size: 14px;
  }

  /* ── PAT prompt overlay ────────────────────────────────────────────── */
  #patPrompt {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
    background: var(--bg);
    z-index: 100;
  }
  #patPrompt[hidden] { display: none; }

  .pat-form {
    width: 100%; max-width: 360px;
    display: flex; flex-direction: column; gap: 1rem;
    padding: 0 2rem;
  }
  .pat-title {
    font-size: 0.6rem; font-weight: 500;
    letter-spacing: 0.04em; text-transform: uppercase;
  }
  .pat-hint {
    font-size: 0.75rem; color: var(--muted); line-height: 1.5;
  }
  .pat-hint a { color: var(--fg); }
  .pat-form input[type="password"] {
    width: 100%; padding: 0.6rem 0;
    border: none; border-bottom: 1px solid var(--border);
    background: none; font: inherit; font-size: 1rem;
    letter-spacing: -0.01em; outline: none;
  }
  .pat-form button {
    align-self: flex-start;
    padding: 0.5rem 1.25rem;
    background: var(--fg); color: var(--bg);
    border: none; font: inherit;
    font-size: 0.6rem; font-weight: 500;
    letter-spacing: 0.04em; text-transform: uppercase;
    cursor: pointer;
  }
  .pat-form button:hover { opacity: 0.75; }
  .pat-error {
    font-size: 0.7rem; color: var(--red);
    letter-spacing: 0.02em; min-height: 1rem;
  }

  /* ── App shell ─────────────────────────────────────────────────────── */
  #app { display: flex; flex-direction: column; height: 100%; }
  #app[hidden] { display: none; }

  /* Header */
  .app-header {
    height: var(--header-h);
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 1.25rem;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  .app-header h1 {
    font-size: 0.6rem; font-weight: 500;
    letter-spacing: 0.04em; text-transform: uppercase;
  }
  .header-right {
    display: flex; align-items: center; gap: 1.5rem;
  }
  #status {
    font-size: 0.6rem; letter-spacing: 0.04em;
    text-transform: uppercase; color: var(--muted);
    min-width: 6rem; text-align: right;
  }
  .sign-out-btn {
    font: inherit; font-size: 0.6rem; font-weight: 500;
    letter-spacing: 0.04em; text-transform: uppercase;
    background: none; border: none; cursor: pointer;
    color: var(--muted);
  }
  .sign-out-btn:hover { color: var(--fg); }

  /* Save / Discard */
  .save-btn {
    font: inherit; font-size: 0.6rem; font-weight: 500;
    letter-spacing: 0.04em; text-transform: uppercase;
    background: var(--fg); color: var(--bg);
    border: none; padding: 0.4rem 0.9rem; cursor: pointer;
  }
  .save-btn:hover { opacity: 0.75; }
  .discard-btn {
    font: inherit; font-size: 0.6rem; font-weight: 500;
    letter-spacing: 0.04em; text-transform: uppercase;
    background: none; border: none; cursor: pointer; color: var(--muted);
  }
  .discard-btn:hover { color: var(--fg); }

  /* Pending indicator */
  .file-card.pending .filename::after { content: ' ·'; font-weight: 700; }

  /* Layout: sidebar + main */
  .app-body {
    display: flex; flex: 1; overflow: hidden;
  }

  /* Sidebar */
  #sidebar {
    width: var(--sidebar-w);
    border-right: 1px solid var(--border);
    overflow-y: auto; flex-shrink: 0;
    padding: 0.5rem 0;
  }
  .student-btn {
    display: block; width: 100%;
    padding: 0.55rem 1.25rem;
    text-align: left; background: none; border: none;
    font: inherit; font-size: 0.875rem;
    cursor: pointer; color: var(--fg);
    transition: background 0.1s;
  }
  .student-btn:hover { background: rgba(0,0,0,0.04); }
  .student-btn.active {
    background: var(--fg); color: var(--bg);
  }

  /* Main detail area */
  #detail {
    flex: 1; overflow-y: auto;
    padding: 1.5rem 2rem 4rem;
  }
  .hint {
    color: var(--muted); font-size: 0.875rem;
    padding-top: 2rem; text-align: center;
  }

  /* Detail section */
  .detail-section { margin-bottom: 2.5rem; }
  .detail-section h2 {
    font-size: 0.6rem; font-weight: 500;
    letter-spacing: 0.04em; text-transform: uppercase;
    color: var(--muted); margin-bottom: 1rem;
    padding-bottom: 0.5rem;
    border-bottom: 1px solid var(--border);
  }

  /* File grid */
  .file-grid {
    display: flex; flex-wrap: wrap; gap: 1rem;
    align-items: flex-start;
  }

  /* File card */
  .file-card {
    width: auto; min-width: 140px; max-width: 260px;
    display: flex; flex-direction: column; gap: 0.5rem;
  }
  .file-card.card-drop-target .thumb { outline: 2px solid var(--fg); outline-offset: -2px; }

  /* Thumbnail */
  .thumb {
    position: relative;
    background: rgba(0,0,0,0.04);
    display: inline-block; line-height: 0;
  }
  .thumb.loading { width: 140px; height: 140px; }
  .thumb img { display: block; }
  .thumb.landscape img { height: 140px; width: auto; }
  .thumb.portrait  img { width: 140px;  height: auto; max-height: 220px; }
  .thumb-video {
    width: 140px; height: 140px;
    background: rgba(0,0,0,0.08);
    display: flex; align-items: center; justify-content: center;
  }
  .file-card[draggable="true"] .thumb { cursor: grab; }
  .video-icon {
    font-size: 1.5rem; color: var(--muted);
  }

  .filename {
    font-size: 0.7rem; color: var(--muted);
    word-break: break-all; line-height: 1.3;
  }

  /* Actions */
  .actions { display: flex; flex-wrap: wrap; gap: 0.35rem; }
  .act-btn {
    font: inherit; font-size: 0.55rem; font-weight: 500;
    letter-spacing: 0.04em; text-transform: uppercase;
    background: none; border: 1px solid var(--border);
    padding: 0.25rem 0.5rem; cursor: pointer; color: var(--fg);
    white-space: nowrap;
  }
  .act-btn:hover { background: rgba(0,0,0,0.05); }
  .act-del { color: var(--red); border-color: rgba(255,0,47,0.25); }
  .act-del:hover { background: rgba(255,0,47,0.05); }

  /* Rename inline */
  .rename-wrap {
    display: flex; align-items: center;
    font-size: 0.7rem;
    border-bottom: 1px solid var(--fg);
    padding-bottom: 1px;
  }
  .rename-prefix { color: var(--muted); white-space: nowrap; }
  .rename-input {
    font: inherit; font-size: 0.7rem;
    background: none; border: none; outline: none;
    min-width: 0; flex: 1;
    color: var(--fg);
  }

  /* Drop zone */
  .drop-zone {
    width: 140px; height: 140px;
    border: 1px dashed var(--border);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; text-align: center;
    transition: border-color 0.15s, background 0.15s;
  }
  .drop-zone span {
    font-size: 0.65rem; color: var(--muted);
    line-height: 1.5; pointer-events: none;
  }
  .drop-zone:hover, .drop-zone.drag-over {
    border-color: var(--fg); background: rgba(0,0,0,0.02);
  }

  /* Video-link block */
  .video-zone {
    width: 220px;
    border: 1px dashed var(--border);
    padding: 0.75rem;
    display: flex;
    flex-direction: column;
    gap: 0.5rem;
  }
  .video-zone-label {
    font-size: 0.65rem; color: var(--muted); line-height: 1.4;
  }
  .video-zone-input {
    font: inherit; font-size: 0.7rem;
    width: 100%; padding: 0.4rem 0.5rem;
    border: 1px solid var(--border);
    background: var(--bg); color: var(--fg);
    outline: none;
  }
  .video-zone-input:focus { border-color: var(--fg); }
  .video-zone-err {
    font-size: 0.6rem; color: var(--red); min-height: 0.85rem;
  }

  /* Add-a-headshot box */
  .add-headshot {
    width: 140px; height: 140px;
    border: 1px dashed var(--border);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; text-align: center;
    transition: border-color 0.15s, background 0.15s;
  }
  .add-headshot span {
    font-size: 0.65rem; color: var(--muted);
    line-height: 1.5; pointer-events: none;
  }
  .add-headshot:hover { border-color: var(--fg); background: rgba(0,0,0,0.02); }

  /* Modal */
  #modal {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.35);
    display: flex; align-items: center; justify-content: center;
    z-index: 200;
  }
  #modal[hidden] { display: none; }
  .modal-box {
    background: var(--bg); padding: 2rem;
    max-width: 340px; width: 90%;
    display: flex; flex-direction: column; gap: 1rem;
  }
  .modal-title {
    font-size: 0.875rem; font-weight: 500;
  }
  .modal-body {
    font-size: 0.8rem; color: var(--muted); line-height: 1.4;
  }
  .modal-actions { display: flex; gap: 0.75rem; }
  .modal-confirm {
    font: inherit; font-size: 0.6rem; font-weight: 500;
    letter-spacing: 0.04em; text-transform: uppercase;
    background: var(--fg); color: var(--bg);
    border: none; padding: 0.5rem 1rem; cursor: pointer;
  }
  .modal-cancel {
    font: inherit; font-size: 0.6rem; font-weight: 500;
    letter-spacing: 0.04em; text-transform: uppercase;
    background: none; border: 1px solid var(--border);
    padding: 0.5rem 1rem; cursor: pointer;
  }

  /* Loading skeleton shimmer */
  @keyframes shimmer {
    0% { opacity: 0.4; } 50% { opacity: 0.7; } 100% { opacity: 0.4; }
  }
  .loading { animation: shimmer 1.4s ease-in-out infinite; }

  /* Project sections */
  .project-section.drag-over {
    outline: 2px dashed var(--fg); outline-offset: 4px;
  }
  .project-hdr {
    display: flex; align-items: center; gap: 0.75rem;
    margin-bottom: 0.75rem; padding-bottom: 0.5rem;
    border-bottom: 1px solid var(--border);
  }
  .collapse-btn {
    font: inherit; font-size: 0.6rem; font-weight: 500;
    background: none; border: 1px solid var(--border);
    padding: 0.15rem 0.35rem; cursor: pointer; color: var(--fg);
    line-height: 1; flex-shrink: 0;
  }
  .collapse-btn:hover { background: rgba(0,0,0,0.05); }
  .drag-handle {
    font-size: 0.75rem; color: var(--muted);
    cursor: grab; user-select: none; flex-shrink: 0;
    padding: 0 0.15rem;
  }
  .drag-handle:active { cursor: grabbing; }
  .project-section.collapsed .file-grid { display: none; }
  .project-title {
    font: inherit; font-size: 0.6rem; font-weight: 500;
    letter-spacing: 0.04em; text-transform: uppercase;
    background: none; border: none; border-bottom: 1px solid transparent;
    outline: none; cursor: text; padding: 0 0 1px; color: var(--fg); min-width: 2rem;
  }
  .project-title:hover, .project-title:focus { border-bottom-color: var(--border); }
  .project-count { font-size: 0.55rem; color: var(--muted); flex: 1; }
  .seq-num {
    position: absolute; top: 4px; left: 4px;
    background: rgba(0,0,0,0.55); color: #fff;
    font-size: 0.5rem; font-weight: 600; padding: 1px 4px; pointer-events: none;
  }
  .new-project-btn {
    font: inherit; font-size: 0.6rem; font-weight: 500;
    letter-spacing: 0.04em; text-transform: uppercase;
    background: none; border: 1px dashed var(--border);
    padding: 0.45rem 1rem; cursor: pointer; color: var(--muted);
    margin-top: 0.5rem; display: inline-block;
  }
  .new-project-btn:hover { border-color: var(--fg); color: var(--fg); }
  .assign-sel {
    font: inherit; font-size: 0.55rem; font-weight: 500;
    letter-spacing: 0.04em; text-transform: uppercase;
    background: none; border: 1px solid var(--border);
    padding: 0.25rem 0.4rem; cursor: pointer; color: var(--fg); max-width: 120px;
  }

  /* Mass upload modal */
  #uploadModal {
    position: fixed; inset: 0; background: rgba(0,0,0,0.35);
    display: flex; align-items: center; justify-content: center; z-index: 210;
  }
  #uploadModal[hidden] { display: none; }
  .upl-box {
    background: var(--bg); width: min(560px, 92vw);
    max-height: 82vh; display: flex; flex-direction: column; overflow: hidden;
  }
  .upl-head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 1.1rem 1.5rem 0.9rem; border-bottom: 1px solid var(--border); flex-shrink: 0;
  }
  .upl-head h2 { font-size: 0.6rem; font-weight: 500; letter-spacing: 0.04em; text-transform: uppercase; }
  .upl-drop {
    margin: 1rem 1.5rem 0; border: 1px dashed var(--border); padding: 1.5rem;
    text-align: center; cursor: pointer; flex-shrink: 0;
    transition: border-color 0.15s, background 0.15s;
  }
  .upl-drop:hover, .upl-drop.drag-over { border-color: var(--fg); background: rgba(0,0,0,0.02); }
  .upl-drop p { font-size: 0.75rem; color: var(--muted); line-height: 1.6; pointer-events: none; }
  .upl-status { font-size: 0.6rem; color: var(--muted); letter-spacing: 0.04em; padding: 0.7rem 1.5rem 0; flex-shrink: 0; min-height: 1.5rem; }
  .upl-rows { flex: 1; overflow-y: auto; padding: 0 1.5rem; }
  .upl-row {
    display: flex; align-items: baseline; gap: 0.5rem;
    padding: 0.4rem 0; border-bottom: 1px solid var(--border); font-size: 0.7rem;
  }
  .upl-src { color: var(--muted); flex: 0 0 38%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .upl-arrow { color: var(--muted); flex-shrink: 0; }
  .upl-dest { flex: 1; }
  .upl-warn { color: var(--red); }
  .upl-foot {
    padding: 0.9rem 1.5rem; border-top: 1px solid var(--border);
    display: flex; justify-content: flex-end; gap: 0.75rem; flex-shrink: 0;
  }

  /* ── Task bar (bottom-right) ──────────────────────────────────────── */
  #taskBar {
    position: fixed;
    bottom: 1.25rem;
    right: 1.25rem;
    min-width: 220px;
    max-width: 340px;
    background: var(--fg);
    color: var(--bg);
    padding: 0.75rem 1rem;
    z-index: 150;
    display: flex;
    flex-direction: column;
    gap: 0.4rem;
    box-shadow: 0 6px 24px rgba(0,0,0,0.18);
    transform: translateY(0);
    transition: opacity 0.25s ease, transform 0.25s ease;
  }
  #taskBar[hidden] {
    display: flex;
    opacity: 0;
    transform: translateY(0.5rem);
    pointer-events: none;
  }
  .task-label {
    font-size: 0.6rem; font-weight: 500;
    letter-spacing: 0.04em; text-transform: uppercase;
  }
  .task-detail {
    font-size: 0.7rem;
    color: rgba(255,255,255,0.65);
    word-break: break-all;
  }
  .task-progress {
    height: 2px; width: 100%;
    background: rgba(255,255,255,0.15);
    overflow: hidden; position: relative;
  }
  .task-progress::after {
    content: '';
    position: absolute; top: 0; left: 0; bottom: 0;
    width: 40%; background: rgba(255,255,255,0.9);
    animation: taskSlide 1.2s ease-in-out infinite;
  }
  @keyframes taskSlide {
    0% { left: -40%; } 100% { left: 100%; }
  }
  #taskBar.task-done .task-progress { display: none; }
  #taskBar.task-error { background: var(--red); }
</style>
</head>
<body>

<!-- PAT prompt -->
<div id="patPrompt">
  <form class="pat-form" id="patForm">
    <p class="pat-title">OTF Library</p>
    <p class="pat-hint">
      Paste a GitHub personal access token with
      <strong>contents:write</strong> access to this repo.
      <br><br>
      <a href="https://github.com/settings/tokens/new?description=OTF+Library&scopes=repo" target="_blank" rel="noopener">Create one on GitHub ↗</a>
    </p>
    <input type="password" id="patInput" placeholder="ghp_…" autocomplete="off" required>
    <div class="pat-error" id="patError"></div>
    <button type="submit">Continue</button>
  </form>
</div>

<!-- Main app -->
<div id="app" hidden>
  <header class="app-header">
    <h1>OTF Library</h1>
    <div class="header-right">
      <span id="status"></span>
      <button class="discard-btn" id="uploadBtn">Upload</button>
      <button class="discard-btn" id="discardBtn" hidden>Discard</button>
      <button class="save-btn" id="saveBtn" hidden>Save</button>
      <button class="sign-out-btn" id="signOut">Sign out</button>
    </div>
  </header>
  <div class="app-body">
    <aside id="sidebar"></aside>
    <main id="detail"><p class="hint">Select a student</p></main>
  </div>
</div>

<!-- Bottom-right task bar -->
<div id="taskBar" hidden>
  <span class="task-label">Working…</span>
  <span class="task-detail"></span>
  <span class="task-progress"></span>
</div>

<!-- Confirmation modal -->
<div id="modal" hidden>
  <div class="modal-box">
    <p class="modal-title"></p>
    <p class="modal-body"></p>
    <div class="modal-actions">
      <button class="modal-confirm">Delete</button>
      <button class="modal-cancel">Cancel</button>
    </div>
  </div>
</div>

<!-- Mass upload modal -->
<div id="uploadModal" hidden>
  <div class="upl-box">
    <div class="upl-head">
      <h2>Mass Upload</h2>
      <button class="sign-out-btn" id="uploadClose">✕</button>
    </div>
    <div class="upl-drop" id="uplDrop">
      <p>Drop files here, or <label for="uplPicker" style="cursor:pointer;text-decoration:underline">Pick files</label><br>Accepts JPG / PNG / WebP</p>
      <input type="file" id="uplPicker" multiple accept=".jpg,.jpeg,.png,.webp" style="display:none">
    </div>
    <div class="upl-status" id="uplStatus"></div>
    <div class="upl-rows" id="uplRows"></div>
    <div class="upl-foot">
      <button class="modal-cancel" id="uploadDone">Done</button>
    </div>
  </div>
</div>

<script>
(() => {
  // ── Constants ──────────────────────────────────────────────────────
  const OWNER   = 'anandmacwan123-tech';

    'Taleb Cherif', 'Tallulah Stott', 'Vanessa Franko', 'Will Vint',
    'Emily Amankwaah', 'Carolina Almeida Ferreira', 'Arnete Kuncyte',
    'Oli Parker', 'Valentina Labriola', 'Elise Havis',

  ];
  const ORDER_PATH = 'Student Work/projects-order.json';

  // ── State ──────────────────────────────────────────────────────────
  let pat            = '';
  let headshots      = []; // { name, sha, path, localUrl?, isPending? }
  let projects       = []; // { name, sha, path, localUrl?, isPending? }
  let currentStudent = null;

  // ── DOM ────────────────────────────────────────────────────────────
  const $ = id => document.getElementById(id);
  const appEl        = $('app');
  const patPromptEl  = $('patPrompt');
  const sidebarEl    = $('sidebar');
  const detailEl     = $('detail');

  const discardBtnEl = $('discardBtn');
  const uplRowsEl    = $('uplRows');
  const uplStatusEl  = $('uplStatus');

  function setStatus(msg) { statusEl.textContent = msg; }

  // ── GitHub API ─────────────────────────────────────────────────────
  async function gh(method, path, body) {
    const url = path.startsWith('http')
      ? path
      : `https://api.github.com/repos/${OWNER}/${REPO}${path}`;
    const res = await fetch(url, {
      method,
      headers: {
        Authorization: `Bearer ${pat}`,
        Accept: 'application/vnd.github+json',
        'Content-Type': 'application/json',
        'X-GitHub-Api-Version': '2022-11-28',
      },
      body: body != null ? JSON.stringify(body) : undefined,
    });
    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      const e = new Error(`GitHub ${res.status}: ${err.message || path}`);
      e.status = res.status;
      throw e;
    }
    return res.json();
  }

  function encPath(p) {
    // Encode path segments but keep slashes
    return p.split('/').map(encodeURIComponent).join('/');
  }

  async function ghContents(dir) {
    return gh('GET', `/contents/${encPath(dir)}?ref=${BRANCH}`);
  }

  async function ghBlob(base64) {
    const r = await gh('POST', '/git/blobs', { content: base64, encoding: 'base64' });
    return r.sha;
  }

  // Read the URL stored inside a .url video-link file.
  async function loadVideoUrl(file) {
    if (file.videoUrl) return file.videoUrl;
    if (!file.sha) return '';
    const data = await gh('GET', `/git/blobs/${file.sha}`);
    return b64decode(data.content).trim();
  }

  // ── Authenticated thumbnail loader ─────────────────────────────────
  // Uses the Git Blobs API (api.github.com) rather than raw.githubusercontent.com
  // because raw URLs block CORS preflight from non-github.com origins.
  async function loadThumb(file) {
    if (file.localUrl) return file.localUrl;
    if (thumbCache.has(file.sha)) return thumbCache.get(file.sha);
    const data = await gh('GET', `/git/blobs/${file.sha}`);
    const binary = atob(data.content.replace(/\n/g, ''));
    const bytes = Uint8Array.from(binary, c => c.charCodeAt(0));
    const ext = file.name.toLowerCase().match(/\.[^.]+$/)?.[0] || '';
    const mime = ext === '.png' ? 'image/png'
               : ext === '.jpg' || ext === '.jpeg' ? 'image/jpeg'
               : 'image/webp';
    const blob = new Blob([bytes], { type: mime });
    const url = URL.createObjectURL(blob);
    thumbCache.set(file.sha, url);
    return url;
  }

  // ── Fetch assets ───────────────────────────────────────────────────
  async function fetchAssets() {
    const [hs, pr] = await Promise.all([
      ghContents(HS_DIR),
      ghContents(PR_DIR),
    ]);
    const toFile = f => ({ name: f.name, sha: f.sha, downloadUrl: f.download_url, path: f.path });
    headshots = hs.filter(f => f.type === 'file').map(toFile);
    projects  = pr.filter(f => f.type === 'file').map(toFile);

    csvStudents = STUDENT_LIST.map(fullName => ({ slug: fullName.split(' ')[0], fullName }));

    // Load persistent project order (file may not exist → 404)
    try {
      const data = await gh('GET', `/contents/${encPath(ORDER_PATH)}?ref=${BRANCH}`);
      projectOrder = JSON.parse(b64decode(data.content));
    } catch { projectOrder = {}; }
  }

  function displayNameFor(slug) {
    const m = csvStudents.find(c => c.slug === slug);
    return m ? m.fullName : slug;
  }

  function studentNames() {
    const set = new Set();
    for (const c of csvStudents) set.add(c.slug);
    for (const h of headshots) set.add(h.name.replace(/\.[^.]+$/, ''));
    for (const p of projects) {
      const us = p.name.indexOf('_');
      if (us > 0) set.add(p.name.slice(0, us));
    }
    return [...set].sort((a,b) => a.localeCompare(b));
  }
  function projectsFor(s) { return projects.filter(p => p.name.startsWith(s + '_')); }
  function headshotFor(s) { return headshots.find(h => h.name.replace(/\.[^.]+$/, '') === s) || null; }

  // Extension of a filename, including the leading dot (defaults to .webp).
  function extOf(name) {
    const m = name.match(/\.[^./]+$/);
    return m ? m[0] : '.webp';
  }

  // Parse a YouTube/Vimeo URL → { provider, id } or null.
  const YOUTUBE_RE = /(?:youtube\.com\/(?:watch\?(?:.*&)?v=|embed\/|shorts\/|live\/)|youtu\.be\/)([\w-]{11})/;
  const VIMEO_RE = /vimeo\.com\/(?:video\/|channels\/[\w]+\/|groups\/[^/]+\/videos\/)?(\d+)/;
  function parseVideoUrl(url) {
    let m;
    if ((m = url.match(YOUTUBE_RE)))
      return { provider: 'youtube', id: m[1] };
    if ((m = url.match(VIMEO_RE)))
      return { provider: 'vimeo', id: m[1] };
    return null;
  }

  function parseFilename(student, filename) {
    const stem = filename.replace(/\.(webp|url)$/i, '');
    const prefix = student + '_';
    if (!stem.startsWith(prefix)) return { kind: 'unknown' };
    const rest = stem.slice(prefix.length);
    const m = rest.match(/^(.+)_(\d+)$/);
    if (m) {
      const project = m[1];
      const n = parseInt(m[2], 10);
      if (project === 'Unassigned') return { kind: 'unassigned-new', n };
      const displayProject = /^Untitled\d+$/.test(project) ? 'Untitled' : project;
      return { kind: 'project', project, displayProject, n };
    }
    return { kind: 'unassigned-legacy', raw: rest };
  }

  function groupForStudent(student) {
    const headshot = headshots.find(h => h.name.replace(/\.[^.]+$/, '') === student) || null;
    const groups = new Map();
    const unassigned = [];
    for (const f of projects) {
      if (!f.name.startsWith(student + '_')) continue;
      const p = parseFilename(student, f.name);
      if (p.kind === 'project') {
        if (!groups.has(p.project)) groups.set(p.project, { displayTitle: p.displayProject, files: [] });
        groups.get(p.project).files.push({ ...f, n: p.n });
      } else {
        unassigned.push(f);
      }
    }
    for (const pnp of pendingNewProjects) {
      if (pnp.student !== student) continue;
      if (!groups.has(pnp.key)) groups.set(pnp.key, { displayTitle: pnp.displayTitle, files: [] });
    }
    for (const g of groups.values()) g.files.sort((a, b) => a.n - b.n);
    return { headshot, unassigned, projects: groups };
  }

  // ── Persistent project ordering ────────────────────────────────────
  function orderedProjectKeys(student, groupMap) {
    const order = projectOrder[student] || [];
    const present = new Set(groupMap.keys());
    const result = [];
    const seen = new Set();
    for (const k of order) {
      if (present.has(k) && !seen.has(k)) { seen.add(k); result.push(k); }
    }
    for (const k of groupMap.keys()) {
      if (!seen.has(k)) { seen.add(k); result.push(k); }
    }
    return result;
  }

  function persistProjectOrder(student, keys) {
    projectOrder[student] = keys;
    pendingQueue = pendingQueue.filter(c => c.path !== ORDER_PATH);
    pendingQueue.push({
      path: ORDER_PATH,
      content: b64encode(JSON.stringify(projectOrder, null, 2)),
    });
    updateSaveBtn();
  }

  function moveProject(student, projectKey, direction) {
    const { projects: groupMap } = groupForStudent(student);
    const keys = orderedProjectKeys(student, groupMap);
    const idx = keys.indexOf(projectKey);
    if (idx < 0) return;
    const swapIdx = direction === 'up' ? idx - 1 : idx + 1;
    if (swapIdx < 0 || swapIdx >= keys.length) return;
    [keys[idx], keys[swapIdx]] = [keys[swapIdx], keys[idx]];
    persistProjectOrder(student, keys);
    renderDetail();
  }

  function nextNFor(student, projectKey) {
    const existing = [];
    for (const f of projects) {
      if (!f.name.startsWith(`${student}_${projectKey}_`)) continue;
      const m = f.name.match(/_(\d+)\.(webp|url)$/i);
      if (m) existing.push(parseInt(m[1], 10));
    }
    for (const c of pendingQueue) {
      if (!c.delete && c.path && c.path.startsWith(`${PR_DIR}/${student}_${projectKey}_`)) {
        const m = c.path.match(/_(\d+)\.(webp|url)$/i);
        if (m) existing.push(parseInt(m[1], 10));
      }
    }
    return existing.length ? Math.max(...existing) + 1 : 1;
  }

  function allocateUntitledK(student) {
    const used = new Set();
    const prefix = student + '_';
    const untitledRe = new RegExp(`^${student.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')}_Untitled(\\d+)_`);
    for (const f of projects) {
      if (!f.name.startsWith(prefix)) continue;
      const m = f.name.match(untitledRe);
      if (m) used.add(parseInt(m[1], 10));
    }
    for (const pnp of pendingNewProjects) {
      if (pnp.student !== student) continue;
      const m = pnp.key.match(/^Untitled(\d+)$/);
      if (m) used.add(parseInt(m[1], 10));
    }
    let k = 1;
    while (used.has(k)) k++;
    return k;
  }

  async function withLimit(tasks, limit = 6) {
    const results = new Array(tasks.length);
    let i = 0;
    async function worker() {
      while (i < tasks.length) {
        const idx = i++;
        results[idx] = await tasks[idx]();
      }
    }
    await Promise.all(Array.from({ length: Math.min(limit, tasks.length) }, worker));
    return results;
  }

  // ── Manifest (ported from scripts/generate-manifest.mjs) ──────────
  function computeManifest(hsNames, prNames) {
    const students = hsNames.map(f => f.replace(/\.webp$/i, '')).sort((a,b) => a.localeCompare(b));
    // Pre-index students for O(1) exact / case-insensitive prefix lookups.
    const studentExact = new Set(students);
    const studentCi = new Map();
    for (const s of students) {
      const lc = s.toLowerCase();
      if (!studentCi.has(lc)) studentCi.set(lc, s);
    }
    const grouped = {};
    for (const file of prNames) {
      const us = file.indexOf('_');
      if (us <= 0) continue;
      const prefix = file.slice(0, us);
      const key = (studentExact.has(prefix) ? prefix : undefined) ?? studentCi.get(prefix.toLowerCase());
      if (!key) continue;
      (grouped[key] ??= []).push(file);
    }
    const manifest = {};
    for (const s of students) {
      manifest[s] = (grouped[s] ?? []).slice().sort((a,b) => a.localeCompare(b));
    }
    return manifest;
  }

  function renderManifestBlock(obj) {
    const keys = Object.keys(obj);
    const lines = ['const MANIFEST = {'];
    keys.forEach((k, i) => {
      const arr = obj[k];
      const vals = '[' + arr.map(f => JSON.stringify(f)).join(', ') + ']';
      lines.push(`      ${JSON.stringify(k)}: ${vals}${i < keys.length - 1 ? ',' : ''}`);
    });
    lines.push('    };');
    return lines.join('\n');
  }

  // base64 encode / decode with full UTF-8 support
  function b64encode(str) {
    return btoa(Array.from(new TextEncoder().encode(str), b => String.fromCharCode(b)).join(''));
  }
  function b64decode(b64) {
    return new TextDecoder().decode(Uint8Array.from(atob(b64.replace(/\n/g, '')), c => c.charCodeAt(0)));
  }

  const MANIFEST_RE = new RegExp(
    '(' + SENT_START.replace(/\//g, '\\/') + ')([\\s\\S]*?)(' + SENT_END.replace(/\//g, '\\/') + ')'
  );

  async function fetchManifestBlobs(afterHsNames, afterPrNames) {
    const manifest = computeManifest(afterHsNames, afterPrNames);
    const block = renderManifestBlock(manifest);
    const re = MANIFEST_RE;
    return Promise.all(MANIFEST_PAGES.map(async pagePath => {
      const data = await gh('GET', `/contents/${encPath(pagePath)}?ref=${BRANCH}`);
      const decoded = b64decode(data.content);
      const updated = decoded.replace(re, `$1\n    ${block}\n    $3`);
      const sha = await ghBlob(b64encode(updated));
      return { path: pagePath, sha };
    }));
  }

  // ── Atomic commit ──────────────────────────────────────────────────
  // changes: [{ path, content? (base64 file bytes), sha? (existing blob), delete? }]
  async function atomicCommit(changes, message) {
    // Compute after-state for manifest
    const afterHs = headshots.map(f => f.name);
    const afterPr = projects.map(f => f.name);
    for (const c of changes) {
      const inHs = c.path.startsWith(HS_DIR + '/');
      const inPr = c.path.startsWith(PR_DIR + '/');
      if (!inHs && !inPr) continue;
      const fname = c.path.slice((inHs ? HS_DIR : PR_DIR).length + 1);
      const arr = inHs ? afterHs : afterPr;
      if (c.delete) {
        const i = arr.indexOf(fname); if (i !== -1) arr.splice(i, 1);
      } else if (!arr.includes(fname)) {
        arr.push(fname);
      }
    }

    // 1. Current ref
    const ref = await gh('GET', `/git/refs/heads/${BRANCH}`);
    const headSha = ref.object.sha;

    // 2. Parent commit + tree
    const parentCommit = await gh('GET', `/git/commits/${headSha}`);
    const baseTree = parentCommit.tree.sha;

    // 3. Create blobs for new file content (rate-limit concurrency)
    const newBlobs = await withLimit(
      changes.filter(c => c.content).map(c => async () => ({
        path: c.path,
        sha: await ghBlob(c.content),
      }))
    );

    // 4. Create updated manifest blobs
    const manifestBlobs = await fetchManifestBlobs(afterHs, afterPr);

    // 5. Build tree
    const blobByPath = new Map(newBlobs.map(b => [b.path, b.sha]));
    const treeEntries = [];
    for (const c of changes) {
      if (c.delete) {
        treeEntries.push({ path: c.path, mode: '100644', type: 'blob', sha: null });
      } else {
        const blobSha = blobByPath.get(c.path);
        treeEntries.push({ path: c.path, mode: '100644', type: 'blob', sha: blobSha != null ? blobSha : c.sha });
      }
    }
    for (const mb of manifestBlobs) {
      treeEntries.push({ path: mb.path, mode: '100644', type: 'blob', sha: mb.sha });
    }

    // 6. New tree
    const newTree = await gh('POST', '/git/trees', { base_tree: baseTree, tree: treeEntries });

    // 7. New commit
    const newCommit = await gh('POST', '/git/commits', {
      message: `library: ${message}`,
      tree: newTree.sha,
      parents: [headSha],
    });

    // 8. Update ref
    await gh('PATCH', `/git/refs/heads/${BRANCH}`, { sha: newCommit.sha });
  }

  // ── File operations ────────────────────────────────────────────────
  function fileToBase64(file) {
    return new Promise((res, rej) => {
      const r = new FileReader();
      r.onload = () => res(r.result.split(',')[1]);
      r.onerror = rej;
      r.readAsDataURL(file);
    });
  }

  // ── Task bar ───────────────────────────────────────────────────────
  const taskBarEl = $('taskBar');
  const taskLabelEl = taskBarEl.querySelector('.task-label');
  const taskDetailEl = taskBarEl.querySelector('.task-detail');
  let taskHideTimer = null;

  function showTask(label, detail = '') {
    clearTimeout(taskHideTimer);
    taskBarEl.classList.remove('task-done', 'task-error');
    taskLabelEl.textContent = label;
    taskDetailEl.textContent = detail;
    taskBarEl.removeAttribute('hidden');
  }
  function finishTask(label, detail = '', isError = false) {
    clearTimeout(taskHideTimer);
    taskBarEl.classList.add(isError ? 'task-error' : 'task-done');
    taskLabelEl.textContent = label;
    taskDetailEl.textContent = detail;
    taskHideTimer = setTimeout(() => taskBarEl.setAttribute('hidden', ''), isError ? 4500 : 1800);
  }

  // ── Image → WebP conversion (browser canvas, handles JPEG + PNG) ──
  function convertToWebP(file, quality = 0.92) {
    return new Promise((resolve, reject) => {
      const url = URL.createObjectURL(file);
      const img = new Image();
      img.onload = () => {
        const canvas = document.createElement('canvas');
        canvas.width = img.naturalWidth;
        canvas.height = img.naturalHeight;
        canvas.getContext('2d').drawImage(img, 0, 0);
        canvas.toBlob(blob => {
          URL.revokeObjectURL(url);
          if (!blob) return reject(new Error('WebP encoding failed'));
          const newName = file.name.replace(/\.(jpg|jpeg|png)$/i, '.webp');
          resolve(new File([blob], newName, { type: 'image/webp' }));
        }, 'image/webp', quality);
      };
      img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('Could not decode image')); };
      img.src = url;
    });
  }

  async function doUploadToProject(fileList, student, isHeadshot, projectKey) {
    const total = fileList.length;
    let idx = 0;
    for (const file of fileList) {
      idx++;
      const lower = file.name.toLowerCase();
      const needsConvert = /\.(jpg|jpeg|png)$/.test(lower);
      const isImg = /\.(jpg|jpeg|png|webp)$/.test(lower);
      const isVid = /\.(mp4|webm)$/.test(lower);
      if (!isImg && !isVid) { alert(`Unsupported file type: ${file.name}`); continue; }

      const counter = total > 1 ? `${idx}/${total} · ` : '';
      let workFile = file;
      try {
        if (needsConvert && isImg) {
          showTask(`${counter}Converting`, file.name);
          workFile = await convertToWebP(file);
        }

        showTask(`${counter}Reading`, workFile.name);
        const b64 = await fileToBase64(workFile);
        const localUrl = URL.createObjectURL(workFile);

        if (isHeadshot) {
          const path = `${HS_DIR}/${student}.webp`;
          const entry = { name: `${student}.webp`, sha: null, path, localUrl, isPending: true };
          const i = headshots.findIndex(h => h.path === path);
          if (i >= 0) { if (headshots[i].localUrl) URL.revokeObjectURL(headshots[i].localUrl); headshots[i] = entry; }
          else headshots.push(entry);
          pendingQueue = pendingQueue.filter(c => c.path !== path);
          pendingQueue.push({ path, content: b64 });
        } else if (projectKey) {
          const n = nextNFor(student, projectKey);
          const newName = `${student}_${projectKey}_${n}.webp`;
          const path = `${PR_DIR}/${newName}`;
          projects.push({ name: newName, sha: null, path, localUrl, isPending: true });
          pendingQueue = pendingQueue.filter(c => c.path !== path);
          pendingQueue.push({ path, content: b64 });
        } else {
          const n = nextNFor(student, 'Unassigned');
          const newName = `${student}_Unassigned_${n}.webp`;
          const path = `${PR_DIR}/${newName}`;
          projects.push({ name: newName, sha: null, path, localUrl, isPending: true });
          pendingQueue = pendingQueue.filter(c => c.path !== path);
          pendingQueue.push({ path, content: b64 });
        }

        finishTask(`${counter}Staged ✓`, workFile.name);
        renderSidebar(); renderDetail(); updateSaveBtn();
      } catch(e) {
        finishTask('Failed', e.message, true);
        return;
      }
    }
  }

  function updateFileRename(file, newPath, newName) {
    const i = projects.findIndex(p => p.path === file.path);
    if (i >= 0) projects[i] = { ...projects[i], name: newName, path: newPath, isPending: true };
    const stagedAdd = pendingQueue.find(c => c.path === file.path && c.content);
    if (stagedAdd) {
      stagedAdd.path = newPath;
    } else {
      pendingQueue = pendingQueue.filter(c => c.path !== file.path && c.path !== newPath);
      pendingQueue.push({ path: file.path, delete: true });
      pendingQueue.push({ path: newPath, sha: file.sha });
    }
  }

  function doAssignToProject(file, toProjectKey) {
    const n = nextNFor(currentStudent, toProjectKey);
    const newName = `${currentStudent}_${toProjectKey}_${n}${extOf(file.name)}`;
    const newPath = `${PR_DIR}/${newName}`;
    updateFileRename(file, newPath, newName);
    renderDetail(); updateSaveBtn();
  }

  function doUnassign(file) {
    const n = nextNFor(currentStudent, 'Unassigned');
    const newName = `${currentStudent}_Unassigned_${n}${extOf(file.name)}`;
    const newPath = `${PR_DIR}/${newName}`;
    updateFileRename(file, newPath, newName);
    renderDetail(); updateSaveBtn();
  }

  function doMoveInProject(file, projectKey, direction) {
    const inProject = projects
      .map(f => ({ f, p: parseFilename(currentStudent, f.name) }))
      .filter(({ p }) => p.kind === 'project' && p.project === projectKey)
      .sort((a, b) => a.p.n - b.p.n)
      .map(({ f }) => f);
    const idx = inProject.findIndex(f => f.path === file.path);
    if (idx < 0) return;
    const swapIdx = direction === 'up' ? idx - 1 : idx + 1;
    if (swapIdx < 0 || swapIdx >= inProject.length) return;
    const fileA = inProject[idx];
    const fileB = inProject[swapIdx];
    const pA = parseFilename(currentStudent, fileA.name);
    const pB = parseFilename(currentStudent, fileB.name);
    const newNameA = `${currentStudent}_${projectKey}_${pB.n}${extOf(fileA.name)}`;
    const newNameB = `${currentStudent}_${projectKey}_${pA.n}${extOf(fileB.name)}`;
    updateFileRename(fileA, `${PR_DIR}/${newNameA}`, newNameA);
    updateFileRename(fileB, `${PR_DIR}/${newNameB}`, newNameB);
    renderDetail(); updateSaveBtn();
  }

  function reorderFileInProject(projectKey, draggedPath, targetPath) {
    if (draggedPath === targetPath) return;
    const inProject = projects
      .map(f => ({ f, p: parseFilename(currentStudent, f.name) }))
      .filter(({ p }) => p.kind === 'project' && p.project === projectKey)
      .sort((a, b) => a.p.n - b.p.n)
      .map(({ f }) => f);
    const dragIdx = inProject.findIndex(f => f.path === draggedPath);
    const targetIdx = inProject.findIndex(f => f.path === targetPath);
    if (dragIdx < 0 || targetIdx < 0) return;
    const dragged = inProject[dragIdx];
    const newOrder = inProject.filter(f => f.path !== draggedPath);
    const insertAt = newOrder.findIndex(f => f.path === targetPath);
    newOrder.splice(insertAt, 0, dragged);
    // Compute final names first, then apply renames.
    const plan = [];
    newOrder.forEach((f, i) => {
      const p = parseFilename(currentStudent, f.name);
      const newN = i + 1;
      if (p.n !== newN) {
        const newName = `${currentStudent}_${projectKey}_${newN}${extOf(f.name)}`;
        plan.push({ file: f, newPath: `${PR_DIR}/${newName}`, newName });
      }
    });
    for (const item of plan) updateFileRename(item.file, item.newPath, item.newName);
    renderDetail(); updateSaveBtn();
  }

  function commitProjectRename(student, oldKey, newTitle) {
    const sanitized = newTitle.trim().replace(/\s+/g, '-').replace(/[^A-Za-z0-9._-]/g, '');
    if (!sanitized || sanitized === oldKey) return;
    if (/^(.+)_(\d+)$/.test(sanitized)) { alert('Project name cannot end with underscore followed by digits.'); return; }
    const { projects: groupMap } = groupForStudent(student);
    if (groupMap.has(sanitized)) { alert(`A project named "${sanitized}" already exists.`); return; }
    const toRename = projects.filter(f => {
      const p = parseFilename(student, f.name);
      return p.kind === 'project' && p.project === oldKey;
    });
    for (const f of toRename) {
      const p = parseFilename(student, f.name);
      const newName = `${student}_${sanitized}_${p.n}${extOf(f.name)}`;
      updateFileRename(f, `${PR_DIR}/${newName}`, newName);
    }
    const pnp = pendingNewProjects.find(p => p.student === student && p.key === oldKey);
    if (pnp) { pnp.key = sanitized; pnp.displayTitle = sanitized; }
    if (projectOrder[student] && projectOrder[student].includes(oldKey)) {
      persistProjectOrder(student, projectOrder[student].map(k => k === oldKey ? sanitized : k));
    }
    renderDetail(); updateSaveBtn();
  }

  function doDeleteProject(student, projectKey) {
    const toDelete = projects.filter(f => {
      const p = parseFilename(student, f.name);
      return p.kind === 'project' && p.project === projectKey;
    });
    for (const f of toDelete) doDelete(f);
    pendingNewProjects = pendingNewProjects.filter(p => !(p.student === student && p.key === projectKey));
    if (projectOrder[student] && projectOrder[student].includes(projectKey)) {
      persistProjectOrder(student, projectOrder[student].filter(k => k !== projectKey));
    }
    renderDetail(); updateSaveBtn();
  }

  function doNewProject(student) {
    const k = allocateUntitledK(student);
    const key = `Untitled${k}`;
    pendingNewProjects.push({ student, key, displayTitle: 'Untitled' });
    renderDetail();
  }

  function parseCSV(csv) {
    const lines = csv.split('\n').filter(l => l.trim());
    return lines.slice(1).map(line => {
      const cols = [];
      let cur = '', inQ = false;
      for (const ch of line) {
        if (ch === '"') inQ = !inQ;
        else if (ch === ',' && !inQ) { cols.push(cur.trim()); cur = ''; }
        else cur += ch;
      }
      cols.push(cur.trim());
      return cols;
    });
  }

  async function loadSheet() {
    if (sheetCache) return sheetCache;
    const resp = await fetch(SHEET_URL);
    if (!resp.ok) throw new Error('Sheet fetch failed');
    const csv = await resp.text();
    const rows = parseCSV(csv);
    sheetCache = rows.map(r => r[2]).filter(Boolean);
    return sheetCache;
  }

  function slugToFullName(slug, names) {
    const lower = slug.toLowerCase();
    return names.find(n => n && n.split(' ')[0].toLowerCase() === lower) || null;
  }

  function appendRow(container, src, dest, warn) {
    const row = document.createElement('div');
    row.className = 'upl-row';
    const srcEl = document.createElement('span');
    srcEl.className = 'upl-src';
    srcEl.textContent = src;
    const arrow = document.createElement('span');
    arrow.className = 'upl-arrow';
    arrow.textContent = '→';
    const destEl = document.createElement('span');
    destEl.className = warn ? 'upl-dest upl-warn' : 'upl-dest';
    destEl.textContent = dest;
    row.append(srcEl, arrow, destEl);
    container.appendChild(row);
  }

  function showUploadModal() {
    uplRowsEl.innerHTML = '';
    uplStatusEl.textContent = '';
    uploadModalEl.removeAttribute('hidden');
  }
  function hideUploadModal() { uploadModalEl.setAttribute('hidden', ''); }

  async function processMassUpload(fileList) {
    const files = Array.from(fileList);
    const rowsEl = uplRowsEl;
    const statusEl2 = uplStatusEl;
    rowsEl.innerHTML = '';
    statusEl2.textContent = `Processing 0/${files.length}…`;

    let names = null;
    try { names = await loadSheet(); } catch { /* fallback */ }

    const batchNextN = new Map();
    // Loop-invariant: the student list does not change while processing the batch.
    const allStudentNames = studentNames();

    const processOne = async (file, idx) => {
      statusEl2.textContent = `Processing ${idx + 1}/${files.length}…`;
      const lower = file.name.toLowerCase();
      const isImg = /\.(jpg|jpeg|png|webp)$/.test(lower);
      if (!isImg) { appendRow(rowsEl, file.name, '⚠ unsupported file type', true); return; }

      let workFile = file;
      try {
        if (/\.(jpg|jpeg|png)$/.test(lower)) workFile = await convertToWebP(file);
      } catch(e) {
        appendRow(rowsEl, file.name, `⚠ conversion failed: ${e.message}`, true);
        return;
      }

      const stem = workFile.name.replace(/\.webp$/i, '');
      const underIdx = stem.indexOf('_');
      const slug = underIdx > 0 ? stem.slice(0, underIdx) : stem;
      const studentMatch = allStudentNames.find(s => s.toLowerCase() === slug.toLowerCase());
      if (!studentMatch) {
        appendRow(rowsEl, file.name, `⚠ no matching student (${slug})`, true);
        return;
      }

      const displayName = (names && slugToFullName(slug, names)) || studentMatch;

      if (underIdx < 0) {
        // Headshot
        const b64 = await fileToBase64(workFile);
        const localUrl = URL.createObjectURL(workFile);
        const path = `${HS_DIR}/${studentMatch}.webp`;
        const entry = { name: `${studentMatch}.webp`, sha: null, path, localUrl, isPending: true };
        const i = headshots.findIndex(h => h.path === path);
        if (i >= 0) { if (headshots[i].localUrl) URL.revokeObjectURL(headshots[i].localUrl); headshots[i] = entry; }
        else headshots.push(entry);
        pendingQueue = pendingQueue.filter(c => c.path !== path);
        pendingQueue.push({ path, content: b64 });
        appendRow(rowsEl, file.name, `${displayName}'s Headshot`);
      } else {
        let projectKey = stem.slice(underIdx + 1).replace(/_\d+$/, '') || stem.slice(underIdx + 1);
        if (!projectKey) projectKey = 'Unassigned';
        const batchKey = `${studentMatch}|${projectKey}`;
        if (!batchNextN.has(batchKey)) batchNextN.set(batchKey, nextNFor(studentMatch, projectKey));
        const n = batchNextN.get(batchKey);
        batchNextN.set(batchKey, n + 1);
        const newName = `${studentMatch}_${projectKey}_${n}.webp`;
        const path = `${PR_DIR}/${newName}`;
        const b64 = await fileToBase64(workFile);
        const localUrl = URL.createObjectURL(workFile);
        projects.push({ name: newName, sha: null, path, localUrl, isPending: true });
        pendingQueue = pendingQueue.filter(c => c.path !== path);
        pendingQueue.push({ path, content: b64 });
        appendRow(rowsEl, file.name, `${displayName} · ${projectKey}`);
      }
      updateSaveBtn();
    };

    await withLimit(files.map((f, i) => () => processOne(f, i)), 4);
    statusEl2.textContent = `Done — ${files.length} file${files.length !== 1 ? 's' : ''} processed`;
    renderSidebar(); renderDetail(); updateSaveBtn();
  }

  function doDelete(file) {
    if (file.localUrl) URL.revokeObjectURL(file.localUrl);
    headshots = headshots.filter(h => h.path !== file.path);
    projects  = projects.filter(p => p.path !== file.path);

    // If it was only staged (not yet on GitHub), just drop it from the queue
    const stagedAdd = pendingQueue.find(c => c.path === file.path && c.content);
    if (stagedAdd) {
      pendingQueue = pendingQueue.filter(c => c.path !== file.path);
    } else {
      pendingQueue = pendingQueue.filter(c => c.path !== file.path);
      if (file.sha) pendingQueue.push({ path: file.path, delete: true });
    }

    renderSidebar(); renderDetail(); updateSaveBtn();
  }

  // ── Save / Discard ─────────────────────────────────────────────────
  function updateSaveBtn() {
    if (pendingQueue.length > 0) {
      saveBtnEl.removeAttribute('hidden');
      discardBtnEl.removeAttribute('hidden');
      saveBtnEl.textContent = `Save (${pendingQueue.length})`;
    } else {
      saveBtnEl.setAttribute('hidden', '');
      discardBtnEl.setAttribute('hidden', '');
    }
  }

  async function doSave() {
    if (!pendingQueue.length) return;
    showTask('Saving…', `${pendingQueue.length} change${pendingQueue.length !== 1 ? 's' : ''}`);
    try {
      await atomicCommit(pendingQueue, 'batch update');
      pendingQueue = [];
      pendingNewProjects = [];
      finishTask('Saved ✓', '');
      await refresh();
    } catch(e) {
      finishTask('Save failed', e.message, true);
    }
  }

  async function doDiscard() {
    for (const f of [...headshots, ...projects]) {
      if (f.localUrl) URL.revokeObjectURL(f.localUrl);
    }
    pendingQueue = [];
    pendingNewProjects = [];
    await refresh();
  }

    const { headshot, unassigned, projects: groupMap } = groupForStudent(currentStudent);
    const frag = document.createDocumentFragment();

    // Headshot section

    hsSec.className = 'detail-section';

    hsSec.appendChild(hsH2);

      hsGrid.appendChild(makeCard(headshot, 'headshot', null, null));
    } else {
      const addBox = document.createElement('div');
      addBox.className = 'add-headshot';
      const lbl = document.createElement('span');
      lbl.textContent = '+ Add a headshot';
      addBox.appendChild(lbl);
      addBox.addEventListener('click', () => {
        const inp = Object.assign(document.createElement('input'), {
          type: 'file', accept: '.webp,.jpg,.jpeg,.png',
        });
        inp.addEventListener('change', () => doUploadToProject(inp.files, currentStudent, true, null));
        inp.click();
      });
      hsGrid.appendChild(addBox);
    }
    hsSec.appendChild(hsGrid);
    frag.appendChild(hsSec);

    // Unassigned section (only shown when there are unassigned files)
    if (unassigned.length > 0) {
      const unaSec = document.createElement('section');
      unaSec.className = 'detail-section';
      const unaH2 = document.createElement('h2');
      unaH2.textContent = `Unassigned (${unassigned.length})`;
      unaSec.appendChild(unaH2);
      const unaGrid = document.createElement('div');
      unaGrid.className = 'file-grid';
      unassigned.forEach(f => unaGrid.appendChild(makeCard(f, 'unassigned', null, null)));
      unaSec.appendChild(unaGrid);
      frag.appendChild(unaSec);
    }

    // Project sections (in persisted order)
    for (const projectKey of orderedProjectKeys(currentStudent, groupMap)) {
      const { displayTitle, files } = groupMap.get(projectKey);
      const sec = document.createElement('section');
      sec.className = 'detail-section project-section';
      sec.dataset.projectKey = projectKey;

      const hdr = document.createElement('div');
      hdr.className = 'project-hdr';

      // Collapse toggle
      const collapseBtn = document.createElement('button');
      collapseBtn.className = 'collapse-btn';
      collapseBtn.type = 'button';
      collapseBtn.textContent = '▾';
      collapseBtn.title = 'Collapse / expand';
      collapseBtn.addEventListener('click', () => {
        const collapsed = sec.classList.toggle('collapsed');
        collapseBtn.textContent = collapsed ? '▸' : '▾';
      });

      // Drag handle
      const handle = document.createElement('span');
      handle.className = 'drag-handle';
      handle.textContent = '⠿';
      handle.title = 'Drag to reorder project';
      handle.setAttribute('draggable', 'true');
      handle.addEventListener('dragstart', e => {
        draggedProjectKey = projectKey;
        e.dataTransfer.effectAllowed = 'move';
      });
      handle.addEventListener('dragend', () => { draggedProjectKey = null; });

      const titleInput = document.createElement('input');
      titleInput.className = 'project-title';
      titleInput.type = 'text';
      titleInput.value = displayTitle;
      titleInput.title = 'Click to rename project';
      let prevTitle = displayTitle;
      titleInput.addEventListener('focus', () => { prevTitle = titleInput.value; });
      titleInput.addEventListener('blur', () => {
        const v = titleInput.value.trim();
        if (v && v !== prevTitle) commitProjectRename(currentStudent, projectKey, v);
        else titleInput.value = prevTitle;
      });
      titleInput.addEventListener('keydown', e => {
        if (e.key === 'Enter') titleInput.blur();
        if (e.key === 'Escape') { titleInput.value = prevTitle; titleInput.blur(); }
      });

      const count = document.createElement('span');
      count.className = 'project-count';
      count.textContent = `${files.length} image${files.length !== 1 ? 's' : ''}`;

      const upBtn = mkBtn('↑', () => moveProject(currentStudent, projectKey, 'up'));
      const downBtn = mkBtn('↓', () => moveProject(currentStudent, projectKey, 'down'));

      const delBtn = mkBtn('× Delete Project', () =>
        showModal(
          `Delete project "${displayTitle}"?`,
          `This will permanently delete all ${files.length} image${files.length !== 1 ? 's' : ''} in this project.`,
          () => doDeleteProject(currentStudent, projectKey)
        )
      );
      delBtn.classList.add('act-del');

      hdr.append(collapseBtn, handle, titleInput, count, upBtn, downBtn, delBtn);
      sec.appendChild(hdr);

      // Section drag-and-drop reorder
      sec.addEventListener('dragover', e => {
        if (draggedProjectKey == null || draggedProjectKey === projectKey) return;
        e.preventDefault();
        sec.classList.add('drag-over');
      });
      sec.addEventListener('dragleave', () => sec.classList.remove('drag-over'));
      sec.addEventListener('drop', e => {
        if (draggedProjectKey == null || draggedProjectKey === projectKey) return;
        e.preventDefault();
        sec.classList.remove('drag-over');
        const keys = orderedProjectKeys(currentStudent, groupMap)
          .filter(k => k !== draggedProjectKey);
        const insertAt = keys.indexOf(projectKey);
        keys.splice(insertAt < 0 ? keys.length : insertAt, 0, draggedProjectKey);
        persistProjectOrder(currentStudent, keys);
        renderDetail();
      });

      const grid = document.createElement('div');
      grid.className = 'file-grid';
      files.forEach((f, idx) => grid.appendChild(makeCard(f, 'project', projectKey, idx + 1)));
      grid.appendChild(makeDropZone(projectKey, false));
      grid.appendChild(makeVideoZone(projectKey));
      sec.appendChild(grid);
      frag.appendChild(sec);
    }

    // + New project button
    const newProjBtn = document.createElement('button');
    newProjBtn.className = 'new-project-btn';
    newProjBtn.textContent = '+ New Project';
    newProjBtn.addEventListener('click', () => doNewProject(currentStudent));
    frag.appendChild(newProjBtn);

    detailEl.innerHTML = '';
    detailEl.appendChild(frag);
  }

  function makeCard(file, context, projectKey, seqN) {
    const card = document.createElement('div');
    card.className = 'file-card' + (file.isPending ? ' pending' : '');

    const thumb = document.createElement('div');
    thumb.className = 'thumb';
    const lower = file.name.toLowerCase();
    if (/\.(mp4|webm|url)$/.test(lower)) {
      thumb.classList.add('thumb-video');
      thumb.innerHTML = '<span class="video-icon">▶</span>';
    } else {
      const img = document.createElement('img');
      img.alt = file.name;
      thumb.classList.add('loading');
      thumb.appendChild(img);
      loadThumb(file)
        .then(url => {
          img.onload = () => {
            thumb.classList.remove('loading');
            if (img.naturalHeight > img.naturalWidth) {
              thumb.classList.add('portrait');
            } else {
              thumb.classList.add('landscape');
            }
          };
          img.onerror = () => { thumb.classList.remove('loading'); };
          img.src = url;
        })
        .catch(() => { thumb.classList.remove('loading'); });
    }
    if (seqN !== null) {
      const badge = document.createElement('span');
      badge.className = 'seq-num';
      badge.textContent = seqN;
      thumb.appendChild(badge);
    }
    card.appendChild(thumb);

    const fn = document.createElement('span');
    fn.className = 'filename';
    fn.textContent = file.name;
    if (/\.url$/i.test(file.name)) {
      loadVideoUrl(file).then(u => { if (u) fn.textContent = u; }).catch(() => {});
    }
    card.appendChild(fn);

    const acts = document.createElement('div');
    acts.className = 'actions';

    if (context === 'headshot') {
      const replBtn = mkBtn('⟲ Replace', () => {
        const inp = Object.assign(document.createElement('input'), {
          type: 'file', accept: '.webp,.jpg,.jpeg,.png',
        });
        inp.addEventListener('change', () => doUploadToProject(inp.files, currentStudent, true, null));
        inp.click();
      });
      acts.appendChild(replBtn);
    } else if (context === 'unassigned') {
      acts.appendChild(makeAssignSelect(file));
    } else if (context === 'project') {
      acts.appendChild(mkBtn('↑', () => doMoveInProject(file, projectKey, 'up')));
      acts.appendChild(mkBtn('↓', () => doMoveInProject(file, projectKey, 'down')));
      acts.appendChild(mkBtn('Unassign', () => doUnassign(file)));

      // Drag-and-drop reorder within the project
      card.setAttribute('draggable', 'true');
      card.dataset.filePath = file.path;
      card.addEventListener('dragstart', e => {
        draggedFilePath = file.path;
        draggedFileProjectKey = projectKey;
        e.dataTransfer.effectAllowed = 'move';
      });
      card.addEventListener('dragend', () => {
        draggedFilePath = null;
        draggedFileProjectKey = null;
      });
      card.addEventListener('dragover', e => {
        if (draggedFilePath == null || draggedFileProjectKey !== projectKey) return;
        if (draggedFilePath === file.path) return;
        e.preventDefault();
        card.classList.add('card-drop-target');
      });
      card.addEventListener('dragleave', () => card.classList.remove('card-drop-target'));
      card.addEventListener('drop', e => {
        if (draggedFilePath == null || draggedFileProjectKey !== projectKey) return;
        if (draggedFilePath === file.path) return;
        e.preventDefault();
        card.classList.remove('card-drop-target');
        reorderFileInProject(projectKey, draggedFilePath, file.path);
      });
    }

    const del = mkBtn('× Delete', () =>
      showModal(`Delete ${file.name}?`, 'This cannot be undone.', () => doDelete(file))
    );
    del.classList.add('act-del');
    acts.appendChild(del);
    card.appendChild(acts);
    return card;
  }

  function makeAssignSelect(file) {
    const { projects: groupMap } = groupForStudent(currentStudent);
    const sel = document.createElement('select');
    sel.className = 'assign-sel';
    const placeholder = document.createElement('option');
    placeholder.value = '';
    placeholder.textContent = 'Assign to…';
    sel.appendChild(placeholder);
    for (const [key, { displayTitle }] of groupMap) {
      const opt = document.createElement('option');
      opt.value = key;
      opt.textContent = displayTitle;
      sel.appendChild(opt);
    }
    const newOpt = document.createElement('option');
    newOpt.value = '__new__';
    newOpt.textContent = 'New project…';
    sel.appendChild(newOpt);
    sel.addEventListener('change', () => {
      const val = sel.value;
      if (!val) return;
      if (val === '__new__') {
        const k = allocateUntitledK(currentStudent);
        const key = `Untitled${k}`;
        pendingNewProjects.push({ student: currentStudent, key, displayTitle: 'Untitled' });
        doAssignToProject(file, key);
      } else {
        doAssignToProject(file, val);
      }
    });
    return sel;
  }

  function mkBtn(label, onClick) {
    const b = document.createElement('button');
    b.className = 'act-btn';
    b.textContent = label;
    b.addEventListener('click', onClick);
    return b;
  }

  function makeDropZone(projectKey, isHeadshot) {
    const zone = document.createElement('div');
    zone.className = 'drop-zone';
    const lbl = document.createElement('span');
    lbl.textContent = '+ Drop files here\nor click to upload';
    zone.appendChild(lbl);

    const inp = Object.assign(document.createElement('input'), {
      type: 'file', multiple: !isHeadshot,
      accept: '.jpg,.jpeg,.png,.webp' + (isHeadshot ? '' : ',.mp4,.webm'),
      style: 'display:none',
    });
    zone.appendChild(inp);

    zone.addEventListener('click', e => { if (e.target !== inp) inp.click(); });
    inp.addEventListener('change', () => doUploadToProject(inp.files, currentStudent, isHeadshot, projectKey));
    zone.addEventListener('dragover', e => { e.preventDefault(); zone.classList.add('drag-over'); });
    zone.addEventListener('dragleave', () => zone.classList.remove('drag-over'));
    zone.addEventListener('drop', e => {
      e.preventDefault(); zone.classList.remove('drag-over');
      doUploadToProject(e.dataTransfer.files, currentStudent, isHeadshot, projectKey);
    });
    return zone;
  }

  // Stage a YouTube/Vimeo link as a .url file inside the project.
  function doAddVideo(student, projectKey, url) {
    const n = nextNFor(student, projectKey);
    const newName = `${student}_${projectKey}_${n}.url`;
    const path = `${PR_DIR}/${newName}`;
    projects.push({ name: newName, sha: null, path, videoUrl: url, isPending: true });
    pendingQueue = pendingQueue.filter(c => c.path !== path);
    pendingQueue.push({ path, content: b64encode(url) });
    renderSidebar(); renderDetail(); updateSaveBtn();
  }

  function makeVideoZone(projectKey) {
    const zone = document.createElement('div');
    zone.className = 'video-zone';

    const lbl = document.createElement('span');
    lbl.className = 'video-zone-label';
    lbl.textContent = 'Add a video (YouTube / Vimeo)';

    const input = document.createElement('input');
    input.type = 'url';
    input.className = 'video-zone-input';
    input.placeholder = 'Paste a video link…';

    const addBtn = document.createElement('button');
    addBtn.type = 'button';
    addBtn.className = 'act-btn';
    addBtn.textContent = '+ Add video';

    const err = document.createElement('span');
    err.className = 'video-zone-err';

    const submit = () => {
      const trimmed = input.value.trim();
      if (!trimmed) { input.focus(); return; }
      if (!parseVideoUrl(trimmed)) { err.textContent = 'Not a YouTube or Vimeo link.'; return; }
      err.textContent = '';
      input.value = '';
      doAddVideo(currentStudent, projectKey, trimmed);
    };
    addBtn.addEventListener('click', submit);
    input.addEventListener('keydown', e => {
      if (e.key === 'Enter') { e.preventDefault(); submit(); }
    });

    zone.append(lbl, input, addBtn, err);
    return zone;
  }

  const stored = localStorage.getItem(LS_PAT);
  if (stored) {
    validatePat(stored).then(ok => {
      if (ok) { localStorage.setItem(LS_PAT, stored); enterApp(); }
      else localStorage.removeItem(LS_PAT);
    });
  }
})();
</script>
