    display: block;
    width: auto;

    position: fixed;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    pointer-events: none;
    user-select: none;
    visibility: hidden;

    align-self: flex-start;
    padding: 0 2px;
    align-items: center;
    justify-content: center;
    gap: 10px;
    font-family: 'IBM Plex Sans', system-ui, sans-serif;
    font-size: 24px;
    font-weight: 700;
    line-height: normal;
    letter-spacing: -0.12em;
    text-transform: uppercase;

  .label-project  { background: #000;    color: #fff; }

  #headshotLabel {
    position: fixed;
    z-index: 5;
    pointer-events: none;
    visibility: hidden;
  }

  .media-wrap {
    display: flex;
    justify-content: center;
    align-items: center;
    width: 100%;
    position: relative;
    z-index: 2;
  }

  .headshot-link {
    display: inline-block;
    position: relative;
    height: clamp(336px, 66vh, 744px);
    line-height: 0;
  }

  .headshot {
    position: absolute;
    top: 0;
    left: 50%;
    transform: translateX(-50%);
    height: 100%;
    width: auto;
    opacity: 0;
    transition: opacity 600ms ease;
    user-select: none;
    -webkit-user-drag: none;
  }

  .headshot.active { opacity: 1; }

  .nav {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    width: 100%;
    display: flex;
    justify-content: center;
    gap: clamp(1.5rem, 5vw, 4rem);
    z-index: 10;
    padding: 1rem 4vw;
    background: var(--bg);
  }

  .nav a {
    color: #000;
    text-decoration: none;
    font-weight: 500;
    font-size: 1rem;
    line-height: 1.25;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    transition: opacity 0.2s ease;
  }

  .nav a:hover { opacity: 0.55; }

  .sr-only {
    position: absolute;
    width: 1px;
    height: 1px;
    padding: 0;
    margin: -1px;
    overflow: hidden;
    clip: rect(0, 0, 0, 0);
    white-space: nowrap;
    border: 0;
  }

  @media (prefers-reduced-motion: reduce) {
    .headshot { transition: none; }
  }

    .headshot-link,

    const brokenStudents = new Set();

    function shuffled(arr) {
      const a = arr.slice();
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    // Shuffle-bag picker: every student appears exactly once before anyone
    // repeats. When the bag empties it is reshuffled for a fresh cycle, and
    // the seam is nudged so the same student never shows twice back-to-back
    // across a cycle boundary.
    function refillBag() {
      const eligible = STUDENTS.filter(n => !brokenStudents.has(n));
      const bag = shuffled(eligible);
      if (bag.length > 1 && bag[bag.length - 1] === lastStudent) {
        [bag[0], bag[bag.length - 1]] = [bag[bag.length - 1], bag[0]];
      }
      studentBag = bag;
    }

    function pickStudent() {
      for (let guard = 0; guard <= STUDENTS.length; guard++) {
        if (studentBag.length === 0) refillBag();
        if (studentBag.length === 0) return null;
        const name = studentBag.pop();
        if (!brokenStudents.has(name)) { lastStudent = name; return name; }
      }
      return null;
    }

    function swapHeadshot() {
      const name = pickStudent();
      if (!name) return;

      const nextIdx = 1 - activeIdx;
      const nextImg = imgs[nextIdx];
      const currentImg = imgs[activeIdx];

      const onload = () => {
        nextImg.classList.add('active');
        currentImg.classList.remove('active');
        headshotLink.href = `/students/${name.toLowerCase()}/`;
        headshotLink.setAttribute('aria-label', `Open ${name}'s portfolio`);
        currentStudent = name;
        projectQueue = shuffled((MANIFEST[name] || []).filter(f => /\.webp$/i.test(f)));
        activeIdx = nextIdx;
        for (const el of placed) el.remove();
        placed.clear();
        // Position the name label flush above the top-left of the headshot.
        const labelEl = document.getElementById('headshotLabel');
        if (labelEl) requestAnimationFrame(() => {
          labelEl.textContent = fullNames.get(name) || name;
          labelEl.style.visibility = 'visible';
          const r = nextImg.getBoundingClientRect();
          labelEl.style.left = r.left + 'px';
          labelEl.style.top = (r.top - labelEl.offsetHeight) + 'px';
        });
      };

      const onerror = () => {
        brokenStudents.add(name);
        nextImg.onload = nextImg.onerror = null;
        // Try again immediately (within this same tick).
        swapHeadshot();
      };

      nextImg.onload = onload;
      nextImg.onerror = onerror;
      nextImg.alt = `${name} — student portrait`;
      nextImg.src = enc(`/Student Work/Headshots/${name}.webp`);
    }

    swapHeadshot();
    setInterval(swapHeadshot, HEADSHOT_INTERVAL_MS);

    /* ───── Background spawn loop (filtered to currentStudent's projects) ───── */

    if (reducedMotion) return;

    const active = new Set();
    const placed = new Set();

    function projectLabelFor(student, file) {
      const stem = file.replace(/\.webp$/i, '').replace(new RegExp('^' + student + '_'), '');
      const m = stem.match(/^(.+)_\d+$/);
      return (m ? m[1] : stem.replace(/\d+$/, '') || stem).replace(/-/g, ' ');
    }

    function spawn() {
      if (!currentStudent) return;
      if (projectQueue.length === 0) return;
      if (active.size >= MAX_ACTIVE) return;
      if (active.size > 0 && Math.random() < 0.4) return;

      const frontChance = mobileMQ.matches ? FRONT_CHANCE * FRONT_CHANCE_MOBILE_MULT : FRONT_CHANCE;
      // On mobile, project images always sit behind the central headshot.
      const zIndex = mobileMQ.matches ? 1 : (Math.random() < frontChance ? 3 : 1);

      const file = projectQueue.pop();

      const wrap = document.createElement('div');
      wrap.className = 'float-wrap';
      wrap.style.zIndex = zIndex;

      const lbl = document.createElement('div');
      lbl.className = 'label label-project';
      lbl.textContent = projectLabelFor(currentStudent, file);
      wrap.appendChild(lbl);

      const img = document.createElement('img');
      img.className = 'student-img';
      img.src = enc(`/Student Work/Projects/${file}`);
      img.alt = '';
      wrap.appendChild(img);

      const place = () => {
        active.delete(wrap);
        const W = window.innerWidth, H = window.innerHeight;
        const renderedH = Math.round(Math.max(280, Math.min(620, H * 0.55)) * (mobileMQ.matches ? 0.6 : 1));
        const w = img.naturalHeight > 0
          ? Math.round(img.naturalWidth * (renderedH / img.naturalHeight))
          : renderedH;
        const hs = headshotLink.getBoundingClientRect();
        const hsMidY = hs.top + hs.height / 2;
        const hsArea = hs.width * hs.height;

        const ok = (x, y) => {
          // At least 80% of the image's area must be within the viewport
          const visW = Math.max(0, Math.min(x + w, W) - Math.max(x, 0));
          const visH = Math.max(0, Math.min(y + renderedH, H) - Math.max(y, 0));
          if (visW * visH < 0.8 * w * renderedH) return false;
          // Must not overlap the top half of the headshot
          if (x + w > hs.left && x < hs.right && y + renderedH > hs.top && y < hsMidY) return false;
          // Must not cover more than 30% of the headshot
          const ow = Math.max(0, Math.min(x + w, hs.right) - Math.max(x, hs.left));
          const oh = Math.max(0, Math.min(y + renderedH, hs.bottom) - Math.max(y, hs.top));
          return ow * oh <= 0.3 * hsArea;
        };

        // Sample from a range that allows up to 20% of the image off-screen on any edge
        const xMin = -Math.round(w * 0.2), xMax = W - Math.round(w * 0.8);
        const yMin = -Math.round(renderedH * 0.2), yMax = H - Math.round(renderedH * 0.8);

        // Spread new images away from those already on screen — best-candidate
        // sampling: try many random spots, keep the one furthest from its
        // neighbours, with a noise factor so the spread stays loose and chaotic
        // rather than perfectly even.
        const centers = [];
        for (const el of placed) {
          const r = el.getBoundingClientRect();
          centers.push([r.left + r.width / 2, r.top + r.height / 2]);
        }

        let best = null, bestScore = -1;
        for (let tries = 0; tries < 40; tries++) {
          const px = Math.round(xMin + Math.random() * (xMax - xMin));
          const py = Math.round(yMin + Math.random() * (yMax - yMin));
          if (!ok(px, py)) continue;
          const mx = px + w / 2, my = py + renderedH / 2;
          let nearest = Infinity;
          for (const [ox, oy] of centers) {
            nearest = Math.min(nearest, Math.hypot(mx - ox, my - oy));
          }
          const dist = nearest === Infinity ? 1e6 : nearest;
          const score = dist * (0.75 + Math.random() * 0.5);
          if (score > bestScore) { bestScore = score; best = { x: px, y: py }; }
        }
        // Guarantee: only display images that land at least 80% in frame.
        if (!best) { wrap.remove(); return; }

        wrap.style.left = best.x + 'px';
        wrap.style.top = best.y + 'px';
        wrap.style.visibility = 'visible';
        placed.add(wrap);
      };
      img.addEventListener('load', place, { once: true });
      img.addEventListener('error', () => {
        wrap.remove();
        active.delete(wrap);
      }, { once: true });

      document.body.appendChild(wrap);
      active.add(wrap);
    }

    requestAnimationFrame(() => {
      spawn();
      setInterval(spawn, SPAWN_INTERVAL_MS);
    });

    let resizeT;
    window.addEventListener('resize', () => {
      clearTimeout(resizeT);
      resizeT = setTimeout(() => {
        for (const el of active) el.remove();
        active.clear();
        for (const el of placed) el.remove();
        placed.clear();
        const labelEl = document.getElementById('headshotLabel');
        if (labelEl && currentStudent) requestAnimationFrame(() => {
          const r = imgs[activeIdx].getBoundingClientRect();
          labelEl.style.left = r.left + 'px';
          labelEl.style.top = (r.top - labelEl.offsetHeight) + 'px';
        });
      }, 120);
    });

    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible') {
        for (const el of active) el.remove();
        active.clear();
        for (const el of placed) el.remove();
        placed.clear();
      }
    });
  })();
  </script>
</body>
</html>
