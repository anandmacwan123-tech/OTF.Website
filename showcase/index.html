<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OTF — Student Showcase</title>
<meta name="description" content="OTF Student Showcase — graphic design work from BA (Hons) Graphic Design, Ravensbourne University London.">
<link rel="canonical" href="https://otfshow.anandmacwan123.workers.dev/showcase/">

<meta property="og:image:type" content="image/jpeg">
<meta property="og:image:alt" content="OTF — Ravensbourne Graphic Design Show">

<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="OTF — Student Showcase">
<meta name="twitter:description" content="OTF Student Showcase — graphic design work from BA (Hons) Graphic Design, Ravensbourne University London.">

<link rel="apple-touch-icon" href="/Favicon.jpg">

<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --red: #FF002F;
    --bg: #fff;
  }

  html, body {
    background: var(--bg);
    font-family: 'IBM Plex Sans', system-ui, sans-serif;
    color: #000;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  body {
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 3vh 4vw 4rem;
    gap: 2.5vh;
    overflow: hidden;
  }

  .student-img {
    display: block;
    width: auto;
    height: clamp(280px, 55vh, 620px);
    -webkit-user-drag: none;
  }

  /* Wrapper for each floating project image — label stacked above, both fixed */
  .float-wrap {
    position: fixed;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    pointer-events: none;
    user-select: none;
    visibility: hidden;
  }

  .label {
    display: inline-flex;
    align-self: flex-start;
    padding: 0 2px;
    align-items: center;
    justify-content: center;
    gap: 10px;
    font-family: 'IBM Plex Sans', system-ui, sans-serif;
    font-size: 16px;
    font-weight: 700;
    line-height: normal;
    letter-spacing: -0.12em;
    text-transform: uppercase;
  }
  .label-headshot { background: #FC1233; color: #000; }
  .label-project  { background: #000;    color: #fff; }

  /* Central headshot name label — JS-positioned to match the image's left edge */
  #headshotLabel {
    position: fixed;
    z-index: 5;
    pointer-events: none;
    visibility: hidden;
  }

  .media-wrap {
    display: flex;
    justify-content: center;
    align-items: center;
    width: 100%;
    position: relative;
    z-index: 2;
  }

  .headshot-link {
    display: inline-block;
    position: relative;
    height: clamp(280px, 55vh, 620px);
    line-height: 0;
  }

  .headshot {
    position: absolute;
    top: 0;
    left: 50%;
    transform: translateX(-50%);
    height: 100%;
    width: auto;
    opacity: 0;
    transition: opacity 600ms ease;
    user-select: none;
    -webkit-user-drag: none;
  }

  .headshot.active { opacity: 1; }

  .nav {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    width: 100%;
    display: flex;
    justify-content: center;
    gap: clamp(1.5rem, 5vw, 4rem);
    z-index: 10;
    padding: 1rem 4vw;
    background: var(--bg);
  }

  .nav a {
    color: #000;
    text-decoration: none;
    font-weight: 500;
    font-size: clamp(0.475rem, 0.55vw + 0.275rem, 0.6rem);
    line-height: 1.25;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    display: inline-block;
    transition: opacity 0.2s ease;
  }

  .nav a:hover { opacity: 0.55; }

  .sr-only {
    position: absolute;
    width: 1px;
    height: 1px;
    padding: 0;
    margin: -1px;
    overflow: hidden;
    clip: rect(0, 0, 0, 0);
    white-space: nowrap;
    border: 0;
  }

  @media (prefers-reduced-motion: reduce) {
    .headshot { transition: none; }
  }
</style>
</head>
<body>
  <h1 class="sr-only">OTF Student Showcase — graphic design work from BA (Hons) Graphic Design, Ravensbourne University London</h1>
  <p class="sr-only">
    Browse this year's graduating graphic designers from Ravensbourne University London.
    Click any portrait to open that student's portfolio.
  </p>

  <div class="media-wrap">
    <a id="headshotLink" class="headshot-link" href="/" aria-label="Open student portfolio">
      <img id="headshotA" class="headshot" alt="">
      <img id="headshotB" class="headshot" alt="">
    </a>
  </div>

  <nav class="nav" aria-label="Primary">
    <a href="/visit/">[VISIT]</a>
    <a href="/info/">[INFO]</a>
    <a href="/index/">[INDEX]</a>
  </nav>

  <div class="label label-headshot" id="headshotLabel" aria-hidden="true"></div>

  <script>
  (() => {
    // __MANIFEST_START__
    const MANIFEST = {
      "Anand": ["Anand_based_1.webp", "Anand_Based_1.webp", "Anand_Evolving_1.webp", "Anand_NCI_1.webp", "Anand_RaveBadge_1.webp", "Anand_ThinkingBlock_1.webp"],
      "Arnete": ["Arnete_Aqva_1.webp", "Arnete_Aqva.webp", "Arnete_Atsijungti_1.webp", "Arnete_Atsijungti.webp", "Arnete_InthePresenceofGreen_1.webp", "Arnete_InthePresenceofGreen.webp", "Arnete_Postcard Series_1.webp", "Arnete_Postcard Series.webp"],
      "Becky": ["Becky_Kopparberg1_1.webp", "Becky_Kopparberg2_1.webp", "Becky_Kopparberg2-1_1.webp"],
      "Carolina": ["Carolina_Aqua_1.webp", "Carolina_Packaging_1.webp", "Carolina_Zine_1.webp"],
      "Charles": ["Charles_Agneshouse_1.webp", "Charles_KpopZine_1.webp", "Charles_TMS_1.webp"],
      "Darcy": ["Darcy_Untitled_1.webp"],
      "Divine": ["Divine_ABOTABOT_1.webp", "Divine_TerraCotta_1.webp", "Divine_UntitledZine_1.webp"],
      "Elise": ["Elise_Tera1_1.webp", "Elise_Tera2_1.webp", "Elise_Tera3_1.webp"],
      "Emily": ["Emily_4THGENZine_1.webp", "Emily_Globular_1.webp", "Emily_Sign_1.webp"],
      "Jaeden": ["Jaeden_FameSucks_1.webp", "Jaeden_FameSucks1_1.webp", "Jaeden_FameSucks2_1.webp"],
      "Jamie": ["Jamie_HemDuyen_1.webp", "Jamie_Kynexus_1.webp"],
      "Jenna": ["Jenna_Aer_1.webp", "Jenna_Privacy Matters_1.webp", "Jenna_Veil_1.webp"],
      "Jess": ["Jess_Aqya_1.webp", "Jess_CFTSOC_1.webp", "Jess_Untitled_1.webp"],
      "Kami": ["Kami_FOOF1_1.webp", "Kami_FOOF2_1.webp", "Kami_FOOF3_1.webp"],
      "Kye": ["Kye_HeadphonesAd_1.webp", "Kye_IncensePackaging_1.webp", "Kye_Untitled_1.webp"],
      "Martim": ["Martim_5PP_1.webp", "Martim_5PP.webp", "Martim_B33ChairPoster_1.webp", "Martim_B33ChairPoster.webp", "Martim_Reflections_1.webp", "Martim_Reflections.webp"],
      "Maseray": ["Maseray_IgnisStudios_1.webp", "Maseray_IgnisStudios.webp", "Maseray_LordandSaviour_1.webp", "Maseray_LordandSaviour.webp", "Maseray_ThedesignersArchive_1.webp", "Maseray_ThedesignersArchive.webp"],
      "Nikol": ["Nikol_Aquari_1.webp", "Nikol_Aquari.webp", "Nikol_CREATEPoster_1.webp", "Nikol_CREATEPoster.webp", "Nikol_WWTPLUposter_1.webp", "Nikol_WWTPLUposter.webp"],
      "Noora": ["Noora_Lipstick_1.webp", "Noora_Lipstick.webp", "Noora_PFI_1.webp", "Noora_PFI.webp", "Noora_RP_1.webp", "Noora_RP.webp"],
      "Nora": ["Nora_Overstack_1.webp", "Nora_Overstack.webp", "Nora_PhobiaFiles_1.webp", "Nora_PhobiaFiles.webp", "Nora_ShakenNotStirred_1.webp", "Nora_ShakenNotStirred.webp", "Nora_ShakenNotStirred2_1.webp", "Nora_ShakenNotStirred2.webp", "Nora_SmultringerPhotography_1.webp", "Nora_SmultringerPhotography.webp", "Nora_SmultringerPhotography2_1.webp", "Nora_SmultringerPhotography2.webp"],
      "Nuria": [],
      "Oli": [],
      "Olya": [],
      "Oscar": [],
      "Rebecca": [],
      "Sara": [],
      "Sasha": [],
      "Sebastian": [],
      "Shalom": [],
      "Surayya": [],
      "Taleb": [],
      "Tallulah": [],
      "Valentina": [],
      "Vanessa": [],
      "Will": []
    };
    // __MANIFEST_END__

    const STUDENTS = Object.keys(MANIFEST);
    if (STUDENTS.length === 0) {
      // No assets yet — leave page idle (centre stays empty).
      return;
    }

    const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    const mobileMQ = window.matchMedia('(max-width: 768px)');

    const HEADSHOT_INTERVAL_MS = reducedMotion ? 6000 : 3000;
    const MAX_ACTIVE = 3;
    const FRONT_CHANCE = 0.35;
    const FRONT_CHANCE_MOBILE_MULT = 1.5;
    const SPAWN_INTERVAL_MS = 180;

    const enc = p => p.split('/').map(encodeURIComponent).join('/');

    // Load full names from the sheet so headshot labels show e.g. "Anand Macwan".
    const SHEET_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTxvTorU4JVoWJPpqxRsiM5SllpkB9mI8oEtaIfX4KYS804dlL6HMo6r97-BHYqhA/pub?output=csv';
    const fullNames = new Map(); // firstName → full name
    fetch(SHEET_URL + '&t=' + Date.now(), { cache: 'no-store' })
      .then(r => r.ok ? r.text() : '')
      .then(text => {
        for (const line of text.split(/\r?\n/)) {
          const parts = line.split(',');
          const raw = (parts[2] || '').replace(/^"|"$/g, '').trim();
          if (raw) fullNames.set(raw.split(/\s+/)[0], raw);
        }
      })
      .catch(() => {});

    // Warm cache for every headshot and every project file.
    STUDENTS.forEach(name => {
      (new Image()).src = enc(`/Student Work/Headshots/${name}.webp`);
      (MANIFEST[name] || []).forEach(file => {
        (new Image()).src = enc(`/Student Work/Projects/${file}`);
      });
    });

    /* ───── Headshot slideshow ───── */

    const headshotLink = document.getElementById('headshotLink');
    const imgs = [
      document.getElementById('headshotA'),
      document.getElementById('headshotB'),
    ];
    let activeIdx = 0;            // which img element currently has .active
    let currentStudent = null;    // drives the background spawn pool
    let projectQueue = [];        // shuffled remaining projects for current student
    const recentStudents = [];
    const brokenStudents = new Set();

    function shuffled(arr) {
      const a = arr.slice();
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    function pickStudent() {
      const eligible = STUDENTS.filter(n => !brokenStudents.has(n));
      if (eligible.length === 0) return null;
      const pool = eligible.filter(n => !recentStudents.includes(n));
      const list = pool.length ? pool : eligible;
      const name = list[Math.floor(Math.random() * list.length)];
      recentStudents.push(name);
      const window_ = Math.min(8, eligible.length - 1);
      while (recentStudents.length > window_) recentStudents.shift();
      return name;
    }

    function swapHeadshot() {
      const name = pickStudent();
      if (!name) return;

      const nextIdx = 1 - activeIdx;
      const nextImg = imgs[nextIdx];
      const currentImg = imgs[activeIdx];

      const onload = () => {
        nextImg.classList.add('active');
        currentImg.classList.remove('active');
        headshotLink.href = `/students/${name.toLowerCase()}/`;
        headshotLink.setAttribute('aria-label', `Open ${name}'s portfolio`);
        currentStudent = name;
        projectQueue = shuffled(MANIFEST[name] || []);
        activeIdx = nextIdx;
        for (const el of placed) el.remove();
        placed.clear();
        // Position the name label flush above the top-left of the headshot.
        const labelEl = document.getElementById('headshotLabel');
        if (labelEl) requestAnimationFrame(() => {
          labelEl.textContent = fullNames.get(name) || name;
          labelEl.style.visibility = 'visible';
          const r = nextImg.getBoundingClientRect();
          labelEl.style.left = r.left + 'px';
          labelEl.style.top = (r.top - labelEl.offsetHeight) + 'px';
        });
      };

      const onerror = () => {
        brokenStudents.add(name);
        nextImg.onload = nextImg.onerror = null;
        // Try again immediately (within this same tick).
        swapHeadshot();
      };

      nextImg.onload = onload;
      nextImg.onerror = onerror;
      nextImg.alt = `${name} — student portrait`;
      nextImg.src = enc(`/Student Work/Headshots/${name}.webp`);
    }

    swapHeadshot();
    setInterval(swapHeadshot, HEADSHOT_INTERVAL_MS);

    /* ───── Background spawn loop (filtered to currentStudent's projects) ───── */

    if (reducedMotion) return;

    const active = new Set();
    const placed = new Set();

    function projectLabelFor(student, file) {
      const stem = file.replace(/\.webp$/i, '').replace(new RegExp('^' + student + '_'), '');
      const m = stem.match(/^(.+)_\d+$/);
      return (m ? m[1] : stem.replace(/\d+$/, '') || stem).replace(/-/g, ' ');
    }

    function spawn() {
      if (!currentStudent) return;
      if (projectQueue.length === 0) return;
      if (active.size >= MAX_ACTIVE) return;
      if (active.size > 0 && Math.random() < 0.4) return;

      const frontChance = mobileMQ.matches ? FRONT_CHANCE * FRONT_CHANCE_MOBILE_MULT : FRONT_CHANCE;
      const zIndex = Math.random() < frontChance ? 3 : 1;

      const file = projectQueue.pop();

      const wrap = document.createElement('div');
      wrap.className = 'float-wrap';
      wrap.style.zIndex = zIndex;

      const lbl = document.createElement('div');
      lbl.className = 'label label-project';
      lbl.textContent = projectLabelFor(currentStudent, file);
      wrap.appendChild(lbl);

      const img = document.createElement('img');
      img.className = 'student-img';
      img.src = enc(`/Student Work/Projects/${file}`);
      img.alt = '';
      wrap.appendChild(img);

      const place = () => {
        active.delete(wrap);
        const W = window.innerWidth, H = window.innerHeight;
        const renderedH = Math.round(Math.max(280, Math.min(620, H * 0.55)));
        const w = img.naturalHeight > 0
          ? Math.round(img.naturalWidth * (renderedH / img.naturalHeight))
          : renderedH;
        const hs = headshotLink.getBoundingClientRect();
        const hsMidY = hs.top + hs.height / 2;
        const hsArea = hs.width * hs.height;

        const ok = (x, y) => {
          // At least 70% of the image must be within the viewport
          const visW = Math.max(0, Math.min(x + w, W) - Math.max(x, 0));
          const visH = Math.max(0, Math.min(y + renderedH, H) - Math.max(y, 0));
          if (visW * visH < 0.7 * w * renderedH) return false;
          // Must not overlap the top half of the headshot
          if (x + w > hs.left && x < hs.right && y + renderedH > hs.top && y < hsMidY) return false;
          // Must not cover more than 30% of the headshot
          const ow = Math.max(0, Math.min(x + w, hs.right) - Math.max(x, hs.left));
          const oh = Math.max(0, Math.min(y + renderedH, hs.bottom) - Math.max(y, hs.top));
          return ow * oh <= 0.3 * hsArea;
        };

        // Sample from a range that allows up to 30% of the image off-screen on any edge
        const xMin = -Math.round(w * 0.3), xMax = W - Math.round(w * 0.7);
        const yMin = -Math.round(renderedH * 0.3), yMax = H - Math.round(renderedH * 0.7);

        let x, y, tries = 0;
        do {
          x = Math.round(xMin + Math.random() * (xMax - xMin));
          y = Math.round(yMin + Math.random() * (yMax - yMin));
          tries++;
        } while (!ok(x, y) && tries < 20);

        wrap.style.left = x + 'px';
        wrap.style.top = y + 'px';
        wrap.style.visibility = 'visible';
        placed.add(wrap);
      };
      img.addEventListener('load', place, { once: true });
      img.addEventListener('error', () => {
        wrap.remove();
        active.delete(wrap);
      }, { once: true });

      document.body.appendChild(wrap);
      active.add(wrap);
    }

    requestAnimationFrame(() => {
      spawn();
      setInterval(spawn, SPAWN_INTERVAL_MS);
    });

    let resizeT;
    window.addEventListener('resize', () => {
      clearTimeout(resizeT);
      resizeT = setTimeout(() => {
        for (const el of active) el.remove();
        active.clear();
        for (const el of placed) el.remove();
        placed.clear();
        const labelEl = document.getElementById('headshotLabel');
        if (labelEl && currentStudent) requestAnimationFrame(() => {
          const r = imgs[activeIdx].getBoundingClientRect();
          labelEl.style.left = r.left + 'px';
          labelEl.style.top = (r.top - labelEl.offsetHeight) + 'px';
        });
      }, 120);
    });

    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible') {
        for (const el of active) el.remove();
        active.clear();
        for (const el of placed) el.remove();
        placed.clear();
      }
    });
  })();
  </script>
</body>
</html>
