<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>You're Invited to OTF</title>
<meta name="description" content="OTF Graphic Design Show / Ravensbourne University London. 4 to 6 June">
<meta property="og:title" content="You're Invited to OTF">
<meta property="og:description" content="OTF Graphic Design Show / Ravensbourne University London. 4 to 6 June">
<meta property="og:image" content="Favicon.jpg">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="You're Invited to OTF">
<meta name="twitter:description" content="OTF Graphic Design Show / Ravensbourne University London. 4 to 6 June">
<meta name="twitter:image" content="Favicon.jpg">
<link rel="icon" type="image/jpeg" href="Favicon.jpg">
<link rel="apple-touch-icon" href="Favicon.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --red: #FF002F;
    --bg: #000;
  }

  html, body {
    background: var(--bg);
    font-family: 'IBM Plex Sans', system-ui, sans-serif;
    color: #fff;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  body {
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 3vh 4vw;
    gap: 2.5vh;
    overflow: hidden;
  }

  .student-img {
    position: fixed;
    pointer-events: none;
    user-select: none;
    -webkit-user-drag: none;
    display: block;
    width: auto;
    height: clamp(240px, 42vh, 510px);
  }

  .media-wrap {
    display: flex;
    justify-content: center;
    align-items: center;
    width: 100%;
    position: relative;
    z-index: 2;
    pointer-events: none;
  }

  .media-wrap video {
    max-width: 100%;
    max-height: 82vh;
    max-height: 82dvh;
    display: block;
    user-select: none;
    pointer-events: none;
    -webkit-user-drag: none;
  }

  .cta {
    width: 100%;
    text-align: center;
    position: relative;
    z-index: 2;
  }

  .cta a {
    color: #fff;
    text-decoration: none;
    font-weight: 500;
    font-size: clamp(0.95rem, 1.1vw + 0.55rem, 1.2rem);
    line-height: 1.25;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    display: inline-block;
    transition: opacity 0.2s ease;
  }

  .cta a:hover { opacity: 0.65; }
</style>
</head>
<body>
  <div class="media-wrap">
    <video
      id="heroVideo"
      src="invite.mp4"
      autoplay
      loop
      muted
      playsinline
      webkit-playsinline
      preload="auto"
      disablepictureinpicture
      disableremoteplayback
      aria-label="You're Invited to OTF — Graphic Design Show, Ravensbourne University London. 4 to 6 June."
    ></video>
  </div>
  <div class="cta">
    <a href="https://100969engagecms.campusnexus.cloud/rul-private-view-event-registration?eventid=15563e02-b71b-f111-8342-000d3ad536b0#msdynmkt_trackingcontext=ebd4f3b4-2403-42e8-9137-53b3b1040200" target="_blank" rel="noopener noreferrer">
      [BOOK YOUR TICKETS]
    </a>
  </div>
  <script>
  (() => {
    // Mobile autoplay fallback
    const vid = document.getElementById('heroVideo');
    if (vid) {
      const tryPlay = () => vid.play().catch(() => {});
      vid.addEventListener('canplay', tryPlay, { once: true });
      tryPlay();
      ['touchstart', 'pointerdown'].forEach(e =>
        document.addEventListener(e, tryPlay, { once: true, passive: true })
      );
    }

    const NAMES = [
      'Anand','Arnete','Becky','Carolina','Charles','Darcy','Divine','Elise',
      'Emily','Jaeden','Jamie','Jenna','Jess','Kami','Kye','Martim','Maseray',
      'Nikol','Noora','Nora','Nuria','Oli','Oscar','Rebecca','Sam','Sara','Sasha',
      'Sebastian','Shalom','Surayya','Taleb','Tallulah','Valentina','Vanessa','Will'
    ];

    const LIFETIME_MS = 900;
    const MAX_ACTIVE = 3;

    const enc = p => p.split('/').map(encodeURIComponent).join('/');
    const active = new Set();
    const recentNames = [];

    function imgHeight() {
      return Math.round(Math.max(240, Math.min(510, window.innerHeight * 0.42)));
    }

    function pickName() {
      const pool = NAMES.filter(n => !recentNames.includes(n));
      const list = pool.length ? pool : NAMES;
      const name = list[Math.floor(Math.random() * list.length)];
      recentNames.push(name);
      if (recentNames.length > Math.min(8, NAMES.length - 1)) recentNames.shift();
      return name;
    }

    function spawn() {
      if (active.size >= MAX_ACTIVE) return;
      // Natural randomness — sometimes don't add another so count varies 1–3
      if (active.size > 0 && Math.random() < 0.4) return;

      const h = imgHeight();
      // ~35% chance to appear in front of the video
      const zIndex = Math.random() < 0.35 ? 3 : 1;

      const img = document.createElement('img');
      img.className = 'student-img';
      img.src = enc(`Student Work/${pickName()}.webp`);
      img.alt = '';
      img.style.zIndex = zIndex;
      // Hide until we know the real width — avoids clipping wide images
      img.style.visibility = 'hidden';

      const place = () => {
        const W = window.innerWidth, H = window.innerHeight;
        const w = img.getBoundingClientRect().width || h;
        const margin = 8;
        const x = Math.round(margin + Math.random() * Math.max(0, W - w - margin * 2));
        const y = Math.round(margin + Math.random() * Math.max(0, H - h - margin * 2));
        img.style.left = x + 'px';
        img.style.top = y + 'px';
        img.style.visibility = 'visible';
      };
      img.addEventListener('load', place, { once: true });

      document.body.appendChild(img);
      active.add(img);

      setTimeout(() => {
        img.remove();
        active.delete(img);
      }, LIFETIME_MS);
    }

    requestAnimationFrame(() => {
      spawn();
      setInterval(spawn, 180);
    });

    let resizeT;
    window.addEventListener('resize', () => {
      clearTimeout(resizeT);
      resizeT = setTimeout(() => {
        for (const el of active) el.remove();
        active.clear();
      }, 120);
    });
  })();
  </script>
</body>
</html>
